function NotesTab({ state, setState, proj }) {
  const notes = state.notes || { goals: "", log: "" };
  const set = (patch) => setState((s) => ({ ...s, notes: { ...(s.notes || {}), ...patch } }));
  const stamp = () => {
    const d = new Date().toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
    set({ log: `${d}\n\n${notes.log || ""}` });
  };
  const words = (notes.log || "").trim() ? (notes.log || "").trim().split(/\s+/).length : 0;

  return (
    <>
      <H>Goals</H>
      <div className="note" style={{ paddingBottom: 8 }}>
        What you're actually trying to achieve, in your own words. The numbers drift; this is the thing to
        check them against.
      </div>
      <Area2 value={notes.goals} rows={7} onChange={(t) => set({ goals: t })}
        placeholder={"Retire at 64 without changing how we live.\nLeave enough that the kids aren't waiting on it.\nStop checking the balance every week."} />

      <H>Lessons and decisions</H>
      <div style={{ display: "flex", alignItems: "center", gap: 10, paddingBottom: 8 }}>
        <button className="btn sm" onClick={stamp}>Stamp today's date</button>
        <span className="note">{words ? `${words.toLocaleString()} words` : "Newest at the top works best"}</span>
      </div>
      <Area2 value={notes.log} rows={18} onChange={(t) => set({ log: t })}
        placeholder={"What you changed and why. What surprised you. What you got wrong last time.\n\nThe entries worth writing are the ones where you talked yourself out of something."} />

      <div className="note" style={{ marginTop: 14 }}>
        Saved with everything else on this device, and included in Backup. Nothing here reaches the
        projection — it's for you, not the model.
      </div>
    </>
  );
}

/* ============================================================
   Method disclosure
   ============================================================ */

const Sect = ({ t, items }) => (
  <>
    <div className="lead-in" style={{ paddingTop: 12, color: "#9A7526", fontWeight: 600 }}>{t}</div>
    {items.map(([k, v], i) => (
      <div className="r" key={i}>
        <span className="lb" style={{ flex: "0 0 33%" }}>{k}</span>
        <span style={{ flex: 1, color: "#5C6472", fontSize: 12 }}>{v}</span>
      </div>
    ))}
  </>
);

function MethodBody({ state, proj }) {
  const a = state.assumptions, p = state.profile, g = proj.spendIsGross, ba = proj.byAccount;
  return (
    <>
      <div className="note" style={{ paddingBottom: 6 }}>
        Ordered by how much each choice moves the answer. The first four are worth arguing about; the rest are
        housekeeping.
      </div>

      <Sect t="1 · Returns and inflation — the largest lever by far" items={[
        ["Rates", `Flat ${pct(n(a.preReturn))} before retirement and ${pct(n(a.postReturn))} after, against ${pct(n(a.inflation))} inflation. No volatility; the stress test is where sequence risk lives.`],
        ["Real return", `${pct(proj.realPostReturn)} in retirement. This single number decides whether the balance compounds or declines, and it is the difference between the plan working and not.`],
        ["Fees", "Not deducted anywhere. Advisor and fund costs have to come out of your return assumption by hand."],
      ]} />

      <Sect t="2 · How tax is modelled" items={[
        ["Current setting", ba
          ? "By account type. Withdrawals come from taxable first (gain taxed at the capital gains rate), then 401(k) and IRA (ordinary income), then HSA and Roth, which come out clean."
          : g ? "One blended rate, and your budgets are stated gross of tax — so the budget already carries the tax bill and nothing is added to withdrawals."
              : "One blended rate added on top of budgets stated net of tax."],
        ["Rates in use", ba ? `${pct(n(a.ordinaryTaxRate), 0)} ordinary, ${pct(n(a.capGainsRate), 0)} capital gains, with ${pct(n(a.taxableBasisShare), 0)} of taxable holdings treated as cost basis.`
                            : `${pct(n(a.effectiveTaxRate), 0)} blended, applied uniformly.`],
        ["The catch when switching", "Blended-gross and by-account mean different things by the same budget number. Gross budgets already contain your tax bill; by-account treats the budget as living costs and adds tax on top. Moving from one to the other without restating the budget will overstate or understate spending by the whole tax amount."],
        ["Lifetime tax", ba ? `${money(proj.cumTax)} across the plan.` : "Not computed in blended-gross mode, because it is assumed to sit inside your spending figures."],
        ["Not modelled", "Required minimum distributions after 73, bracket structure, the 2026 rate sunset, state tax unless it is inside your rate, and Roth conversions."],
      ]} />

      <Sect t="3 · Spending and the mortgage" items={[
        ["Budgets", `${money(n(a.budgetA.amount))} for ${n(a.budgetA.years)} years from ${proj.retAge}, then ${money(n(a.budgetB.amount))} to the end. Today's dollars, inflated to the year spent.`],
        ["Mortgage payment", proj.mortgageInSpend
          ? `Added from the real amortisation schedule while the loan runs, then it stops. Fixed in nominal dollars, so unlike everything else it never inflates. ${proj.mortRetirementYears} years of it fall in retirement, costing ${money(proj.mortRetirementDraw)}.`
          : `Assumed to sit inside your budgets — which then stay flat after the loan clears at ${proj.mortPayoffAge}, charging you for a mortgage you no longer have.`],
        ["Behaviour", "Fixed budgets regardless of markets. Real retirees cut back in a downturn, so this is conservative."],
      ]} />

      <Sect t="4 · Social Security" items={[
        ["Amount", `${money(proj.ss.annualAtClaim)} a year in today's money, claimed at ${proj.ss.claimAge}, covering ${pct(proj.ssCoverage, 0)} of retirement spending.`],
        ["Cost of living", proj.ssCola ? `Grows with your ${pct(n(a.inflation))} inflation assumption, so the first cheque is ${money(proj.ss.annualAtClaim * Math.pow(1 + n(a.inflation), proj.ss.claimAge - n(p.currentAge)))} in the dollars of that year.`
                                       : "Frozen in today's dollars — no cost-of-living adjustment. Deliberately pessimistic."],
        ["Formula", `Standard PIA on current bend points ($${SS_DEFAULTS.bend1.toLocaleString()} and $${SS_DEFAULTS.bend2.toLocaleString()}), every year from ${n(a.ssFirstYear)} assumed at the ${money(n(a.taxableMax))} wage cap, best 35 counted. You have ${proj.ss.yearsCredited}.`],
        ["Left out", "Wage indexing of past earnings, which understates the benefit. Spousal and survivor benefits. Any haircut for the trust fund shortfall projected for the mid-2030s."],
      ]} />

      <Sect t="5 · What reaches the portfolio" items={[
        ["Vesting equities", `${money(proj.vestDirected)} of ${money(proj.vestScheduled)} scheduled, at the share set on each tranche. Lands at the start of its year and earns a full year of return.`],
        ["Cash inflows", `${money(proj.inflowDirected)} of ${money(proj.inflowScheduled)} scheduled is invested; the rest is assumed spent.`],
        ["Contributions", `${money(n(a.annualContribution))} this year, growing ${pct(n(a.contributionGrowth))} a year${a.contribStepDown && n(a.contribStepYear) ? `, stepping down to ${money(n(a.contribStepTo))} flat from ${n(a.contribStepYear)}` : ""}. Split ${pct(n(a.contribToDeferred), 0)} deferred, ${pct(n(a.contribToRoth), 0)} Roth, ${pct(n(a.contribToHSA), 0)} HSA, remainder taxable.`],
        ["Never included", `Cash reserve of ${money(n(p.cashReserve))}, 529 balances of ${money(n(p.fiveTwoNine))}, and unvested holdings except through dated tranches. Salary and bonus reach nothing at all — Social Security assumes the wage cap every year, so income is not read by the model.`],
      ]} />

      <Sect t="6 · Timing conventions" items={[
        ["Steps", "One year at a time. Vesting arrives at the start of its year and earns the full year; contributions, inflows and withdrawals are treated as spread through the year and earn about half."],
        ["Dollars", `Every figure on screen is money of its own year. The buying power column on Year by year restates balances in ${n(a.baseYear, CY)} dollars.`],
        ["Legacy goal", `${money(n(a.legacyGoal))} in today's money becomes ${money(proj.goalNominal)} by ${proj.deathAge} before being scored.`],
      ]} />

      <Sect t="7 · The house" items={[
        ["Materiality", "Tested: removing the house entirely changes the portfolio at retirement, the drawdown and whether the money lasts by nothing at all. It moves only the estate figure."],
        ["Mechanics", `Value grows ${pct(n(a.homeAppreciation))}${a.homeValueCap ? ` to a ceiling of ${money(n(a.homeValueCap))}` : " without limit"}; equity is value less the outstanding balance. ${a.sellHomeAge ? `Sold at ${n(a.sellHomeAge)} with ${pct(n(a.homeReleasePct), 0)} of equity moved into the portfolio.` : "Held for life."}`],
        ["Excluded", "Maintenance, property tax and insurance. Home equity never funds spending unless you sell."],
      ]} />

      <Sect t="8 · The mortgage question, settled" items={[
        ["Before retirement", `Do not pay it down. ${pct(n(a.preReturn))} in the market against a ${pct(n(p.mortgageRate))} loan, and diverted money compounds for decades. Tested at $25k, $50k and $75k a year from saving: all worse, the $50k case giving up about $2.1M at 95 to save $813k of interest.`],
        ["At retirement", `Close to a tie. Post-retirement ${pct(n(a.postReturn))} sits below the ${pct(n(p.mortgageRate))} rate, so a lump payoff edges out investing by roughly $31k on an $8.5M portfolio — some of which is a timing convention, not economics.`],
        ["The real argument", "The rate avoided is certain; the return expected is not. Within a point of each other, take the certain one."],
      ]} />

      <Sect t="9 · The stress test" items={[
        ["Method", `${SEQ_LEN}-year runs of real S&P 500 total returns 1928–2025, three crash timings around retirement, blended with a non-equity sleeve at ${pct(n((state.stress || {}).otherReal, 0.06))} real.`],
        ["Inflation handling", "Inflation-matched strips each year's actual CPI and re-applies your assumption. Raw nominal replays returns as printed and badly flatters the 1970s."],
        ["Reading it", "History, not probability. Ninety-eight years holds about three independent thirty-year sequences, so a 90% survival rate is not a 90% chance."],
      ]} />

      <Sect t="10 · Absent entirely" items={[
        ["Health and care", "No long-term care, medical shock or Medicare premium detail. One late-life care event can exceed everything else in the plan."],
        ["Longevity", `Stops at ${proj.deathAge}. No probability of living longer, no annuity or pooled risk.`],
        ["Household", "One person. No spouse's income, accounts, benefits or lifespan."],
        ["Employment", "Continuous earnings to retirement. No job loss, sabbatical or disability."],
      ]} />

      <div className="note" style={{ marginTop: 14 }}>
        A planning model, not advice. Its value is showing which assumptions your conclusion rests on.
      </div>
    </>
  );
}

/* RetireMint mark — Meridian. A struck disc crossed by a rising band that runs the
   full width and is cropped by the circle, so the movement continues past the frame.
   Identical geometry to the icon set, so the two never drift apart. */
const Logo = ({ size = 26 }) => (
  <svg width={size} height={size} viewBox="0 0 40 40" aria-label="RetireMint" role="img"
    style={{ flex: "0 0 auto", display: "block" }}>
    <defs><clipPath id="meridianClip"><circle cx="20.00" cy="20.00" r="15.20"/></clipPath></defs><circle cx="20.00" cy="20.00" r="15.20" fill="#DDEBE2"/><path d="M2.40 26.20 L2.63 26.21 L3.00 26.20 L3.40 26.18 L3.82 26.14 L4.24 26.09 L4.68 26.03 L5.12 25.96 L5.56 25.89 L6.01 25.80 L6.46 25.71 L6.92 25.61 L7.37 25.50 L7.83 25.38 L8.30 25.26 L8.76 25.13 L9.23 25.00 L9.69 24.86 L10.16 24.71 L10.63 24.56 L11.11 24.40 L11.58 24.23 L12.06 24.07 L12.53 23.89 L13.01 23.71 L13.49 23.52 L13.97 23.33 L14.45 23.14 L14.93 22.94 L15.41 22.73 L15.89 22.52 L16.38 22.30 L16.86 22.08 L17.35 21.86 L17.83 21.63 L18.32 21.40 L18.81 21.16 L19.29 20.92 L19.78 20.67 L20.27 20.42 L20.76 20.16 L21.25 19.91 L21.74 19.64 L22.23 19.37 L22.72 19.10 L23.22 18.83 L23.71 18.55 L24.20 18.27 L24.70 17.98 L25.19 17.69 L25.68 17.39 L26.18 17.09 L26.67 16.79 L27.17 16.49 L27.66 16.18 L28.16 15.86 L28.66 15.55 L29.15 15.23 L29.65 14.90 L30.15 14.58 L30.64 14.24 L31.14 13.91 L31.64 13.57 L32.14 13.23 L32.64 12.89 L33.14 12.54 L33.64 12.19 L34.14 11.83 L34.64 11.47 L35.14 11.11 L35.64 10.75 L36.14 10.38 L36.64 10.01 L38.56 12.39 L38.09 12.81 L37.61 13.22 L37.13 13.64 L36.65 14.05 L36.18 14.45 L35.70 14.86 L35.22 15.26 L34.74 15.65 L34.26 16.05 L33.78 16.44 L33.30 16.83 L32.82 17.22 L32.34 17.60 L31.86 17.98 L31.38 18.35 L30.90 18.73 L30.42 19.10 L29.94 19.46 L29.45 19.83 L28.97 20.19 L28.49 20.54 L28.01 20.90 L27.52 21.25 L27.04 21.59 L26.55 21.94 L26.07 22.27 L25.58 22.61 L25.10 22.94 L24.61 23.27 L24.12 23.60 L23.64 23.92 L23.15 24.24 L22.66 24.55 L22.17 24.86 L21.68 25.17 L21.19 25.47 L20.70 25.77 L20.21 26.07 L19.72 26.36 L19.23 26.65 L18.73 26.93 L18.24 27.21 L17.75 27.48 L17.25 27.75 L16.75 28.02 L16.26 28.28 L15.76 28.54 L15.26 28.79 L14.76 29.03 L14.26 29.28 L13.75 29.51 L13.25 29.75 L12.74 29.97 L12.24 30.20 L11.73 30.41 L11.22 30.63 L10.71 30.83 L10.19 31.03 L9.68 31.22 L9.16 31.41 L8.64 31.59 L8.12 31.77 L7.59 31.93 L7.06 32.09 L6.53 32.24 L5.99 32.39 L5.45 32.52 L4.89 32.64 L4.33 32.76 L3.75 32.86 L3.15 32.94 L2.40 33.00Z" fill="#9A7526" clip-path="url(#meridianClip)"/><circle cx="20.00" cy="20.00" r="15.20" fill="none" stroke="#1E7A5A" stroke-width="1.68"/>
  </svg>
);

function App() {
  const [state, setState] = useState(DEFAULT_STATE);
  const [loaded, setLoaded] = useState(false);
  const [status, setStatus] = useState("Loading…");
  const [leftTab, setLeftTab] = useState("inputs");
  const [rightTab, setRightTab] = useState("outlook");
  const [chartView, setChartView] = useState("balance");
  const [compareIds, setCompareIds] = useState([]);
  const [open, setOpen] = useState({});
  const toggle = (id) => setOpen((o) => ({ ...o, [id]: !o[id] }));
  const first = useRef(true);
  const latest = useRef(state);
  const dirty = useRef(false);
  useEffect(() => { latest.current = state; }, [state]);

  const writeNow = async () => {
    const res = persist(latest.current);
    if (res.ok) { dirty.current = false; setStatus("Saved " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })); }
    else setStatus("Not saved: " + res.error);
  };

  useEffect(() => {
    let alive = true;
    (async () => {
      const res = loadState();
      if (!alive) return;
      if (res.data) {
        setState(normalize(res.data));
        setStatus("Loaded");
      } else setStatus(res.ok ? "New plan" : "Storage unavailable — copy a backup before leaving");
      setLoaded(true);
    })();
    return () => { alive = false; };
  }, []);

  useEffect(() => {
    if (!loaded) return;
    if (first.current) { first.current = false; return; }
    dirty.current = true;
    setStatus("Saving…");
    const t = setTimeout(() => { writeNow(); }, 500);
    return () => clearTimeout(t);
  }, [state, loaded]);

  useEffect(() => {
    if (!loaded) return;
    const flush = () => { if (dirty.current) persist(latest.current); };
    const onVis = () => { if (document.visibilityState === "hidden") flush(); };
    window.addEventListener("pagehide", flush);
    document.addEventListener("visibilitychange", onVis);
    return () => {
      window.removeEventListener("pagehide", flush);
      document.removeEventListener("visibilitychange", onVis);
      flush();
    };
  }, [loaded]);

  const setA = (patch) => setState((s) => ({ ...s, assumptions: { ...s.assumptions, ...patch } }));
  const setP = (patch) => setState((s) => ({ ...s, profile: { ...s.profile, ...patch } }));

  const proj = useMemo(() => project(state.profile, state.assumptions), [state.profile, state.assumptions]);
  const levers = useMemo(() => ({
    contribution: solveContribution(state.profile, state.assumptions),
    retAge: solveRetirementAge(state.profile, state.assumptions),
    ret: solveReturn(state.profile, state.assumptions),
  }), [state.profile, state.assumptions]);

  const baseline = (state.scenarios || []).find((s) => s.isBaseline);
  const baselineProj = useMemo(() => (baseline ? project(baseline.profile, baseline.assumptions) : null), [baseline]);
  const compare = useMemo(() => compareIds.map((id) => {
    const s = (state.scenarios || []).find((x) => x.id === id);
    return s ? { id, name: s.name, proj: project(s.profile, s.assumptions) } : null;
  }).filter(Boolean), [compareIds, state.scenarios]);

  const stressCfg = state.stress || DEFAULT_STATE.stress;
  const setCfg = (patch) => setState((s) => ({ ...s, stress: { ...(s.stress || DEFAULT_STATE.stress), ...patch } }));
  const stress = useMemo(() => rightTab !== "stress" ? null
    : stressTest(state.profile, state.assumptions, { ...stressCfg, anchors: [-3, 0, 3] }),
    [rightTab, state.profile, state.assumptions, stressCfg.equityShare, stressCfg.otherReal, stressCfg.mode, stressCfg.window]);

  const real = false;   // all figures are shown in the dollars of their year
  const dfEnd = Math.pow(1 + n(state.assumptions.inflation), proj.deathAge - proj.age0);
  const dfRet = Math.pow(1 + n(state.assumptions.inflation), proj.retAge - proj.age0);
  const show = (v) => v;
  /* Second line on the headline stats: the same amount restated in the dollars of
     the year your legacy goal is stated in, so the two are directly comparable. */
  const inGoalYear = (v, atAge) =>
    v / Math.pow(1 + n(state.assumptions.inflation), (CY + atAge - proj.age0) - proj.goalYear);
  const gy = proj.goalYear;

  const backup = async () => {
    try { await navigator.clipboard.writeText(JSON.stringify(state)); setStatus("Backup copied"); }
    catch (e) { setStatus("Couldn't reach the clipboard"); }
  };
  const restore = () => {
    const txt = window.prompt("Paste a backup to replace everything:");
    if (!txt) return;
    try {
      const d = JSON.parse(txt);
      setState(normalize(d));
      setStatus("Backup restored");
    } catch (e) { setStatus("That wasn't a valid backup"); }
  };

  const lasts = !proj.depletionAge;
  const leftOver = show(proj.terminalPortfolio, dfEnd);

  return (
    <div className="rp">
      <style>{CSS}</style>

      <div className="hd">
        <Logo />
        <h1 style={{ letterSpacing: "-0.02em" }}>{state.profile.name ? `${state.profile.name}'s plan` : "RetireMint"}</h1>
        <span className="sub">{n(state.profile.currentAge)} today · retiring {proj.retAge} · through {proj.deathAge}</span>
        <div className="right">
          <button className="btn sm" onClick={writeNow}>Save</button>
          <button className="btn gh sm" onClick={backup}>Backup</button>
          <button className="btn gh sm" onClick={restore}>Restore</button>
          <span className="note">{status}</span>
        </div>
      </div>

      <div className="verdict">
        <div className="lead">
          {lasts ? <>Funded through {proj.deathAge}, with <span className="big fig pos">{moneyShort(proj.terminalPortfolio)}</span>{" "}
                   <span className="fig br" style={{ fontSize: 15 }}>({moneyShort(inGoalYear(proj.terminalPortfolio, proj.deathAge))} in {gy}$)</span> left over</>
                 : <>Runs out at <span className="big fig neg">{proj.depletionAge}</span>, {proj.deathAge - proj.depletionAge} years short</>}
        </div>
        <div className="stats">
          <div className="stat"><div className="k">At retirement</div>
            <div className="v fig">{moneyShort(proj.portfolioAtRetirement)}</div>
            <div className="v2 fig br">{moneyShort(inGoalYear(proj.portfolioAtRetirement, proj.retAge))} in {gy}$</div></div>
          <div className="stat"><div className="k">You withdraw</div>
            <div className="v fig">{pct(proj.withdrawalRate)}</div></div>
          <div className="stat"><div className="k">Portfolio earns</div>
            <div className="v fig">{pct(proj.realPostReturn)}</div></div>
          <div className="stat"><div className="k">Legacy goal</div>
            <div className={"v fig " + (proj.legacyGap >= 0 ? "pos" : "neg")}>
              {(proj.legacyGap >= 0 ? "+" : "\u2212") + moneyShort(Math.abs(proj.legacyGap))}</div>
            <div className="v2 fig br">
              {(proj.legacyGap >= 0 ? "+" : "\u2212") + moneyShort(Math.abs(inGoalYear(proj.legacyGap, proj.deathAge)))} in {gy}$</div></div>
        </div>
      </div>

      <div className="split">
        <div className="pane">
          <div className="tabs">
            <button className={"tab " + (leftTab === "inputs" ? "on" : "")} onClick={() => setLeftTab("inputs")}>Your plan</button>
            <button className={"tab " + (leftTab === "explore" ? "on" : "")} onClick={() => setLeftTab("explore")}>Explore</button>
          </div>
          <div className="body">
            {leftTab === "inputs" && <InputsTab state={state} setA={setA} setP={setP} proj={proj} open={open} toggle={toggle} />}
            {leftTab === "explore" && <ExploreTab state={state} setA={setA} setState={setState} proj={proj} open={open} toggle={toggle} />}
          </div>
        </div>

        <div className="pane">
          <div className="tabs">
            <button className={"tab " + (rightTab === "outlook" ? "on" : "")} onClick={() => setRightTab("outlook")}>Outlook</button>
            <button className={"tab " + (rightTab === "years" ? "on" : "")} onClick={() => setRightTab("years")}>Year by year</button>
            <button className={"tab " + (rightTab === "stress" ? "on" : "")} onClick={() => setRightTab("stress")}>Stress test</button>
            <button className={"tab " + (rightTab === "track" ? "on" : "")} onClick={() => setRightTab("track")}>Tracking</button>
            <button className={"tab " + (rightTab === "notes" ? "on" : "")} onClick={() => setRightTab("notes")}>Notes</button>
          </div>
          <div className="body">
            {rightTab === "outlook" && <OutlookTab proj={proj} state={state} real={real} compare={compare}
              levers={levers} view={chartView} setView={setChartView} />}
            {rightTab === "years" && <YearsTab proj={proj} real={real} a={state.assumptions} setA={setA} />}
            {rightTab === "stress" && <StressTab result={stress} cfg={stressCfg} setCfg={setCfg} proj={proj} />}
            {rightTab === "notes" && <NotesTab state={state} setState={setState} proj={proj} />}
            {rightTab === "track" && <TrackingTab state={state} setState={setState} proj={proj}
              baselineProj={baselineProj} compareIds={compareIds} setCompareIds={setCompareIds}
              open={open} toggle={toggle} />}
          </div>
        </div>
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));

</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>
</body>
</html>
