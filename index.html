/* ============================================================
   Social Security estimate
   ============================================================ */

function computeSS(profile, a) {
  const max = n(a.taxableMax, SS_DEFAULTS.taxableMax) || SS_DEFAULTS.taxableMax;
  const first = n(a.ssFirstYear, CY - 20);
  const age0 = n(profile.currentAge, 40);
  const retAge = n(a.retirementAge, 65);

  // Every year of earnings is assumed to reach the taxable maximum, past and future.
  const pastYears = Math.max(0, CY - first);
  const futureYears = Math.max(0, retAge - age0);
  const totalYears = pastYears + futureYears;
  const credited = Math.min(35, totalYears);

  const aime = (credited * max) / 420;

  const b1 = SS_DEFAULTS.bend1, b2 = SS_DEFAULTS.bend2;
  const pia =
    0.9 * Math.min(aime, b1) +
    0.32 * Math.max(0, Math.min(aime, b2) - b1) +
    0.15 * Math.max(0, aime - b2);

  const fra = n(a.fra, 67);
  const claimAge = a.waitForFRA ? fra : clamp(n(a.claimAge, 62), 62, 70);
  const months = Math.round((claimAge - fra) * 12);
  let factor = 1;
  if (months < 0) {
    const early = -months;
    const first36 = Math.min(early, 36);
    const rest = Math.max(0, early - 36);
    factor = 1 - (first36 * 5) / 900 - (rest * 5) / 1200;
  } else if (months > 0) {
    factor = 1 + Math.min(months, 36) * (2 / 300);
  }

  return {
    aime,
    piaMonthly: pia,
    claimAge,
    factor,
    monthlyAtClaim: pia * factor,
    annualAtClaim: pia * factor * 12,
    yearsCredited: totalYears,
    creditedUsed: credited,
    pastYears, futureYears,
  };
}

/* ---------- mortgage amortisation ----------
   Annual schedule. Extra payments hit principal at the start of the year, before
   interest accrues. One entry per year from startYear. */
function amortize(balance, annualRate, monthlyPay, extrasByYearMap, startYear, years, firstYearMonths) {
  const r = annualRate / 12;
  const sched = [];
  let bal = Math.max(0, balance);
  let totalInterest = 0, payoffOffset = null;
  for (let i = 0; i < years; i++) {
    const year = startYear + i;
    const open = bal;
    const extra = bal > 0 ? Math.min(bal, extrasByYearMap[year] || 0) : 0;
    bal -= extra;
    let interest = 0, principal = 0;
    const months = i === 0 ? (firstYearMonths == null ? 12 : firstYearMonths) : 12;
    for (let m = 0; m < months && bal > 0; m++) {
      const int = bal * r;
      const pay = Math.min(monthlyPay, bal + int);
      const prin = Math.max(0, pay - int);
      bal = Math.max(0, bal - prin);
      interest += int; principal += prin;
    }
    totalInterest += interest;
    if (bal <= 0 && payoffOffset === null && open > 0) payoffOffset = i;
    sched.push({ year, open, extra, interest, principal, balance: bal });
  }
  return { sched, totalInterest, payoffOffset, neverPaysOff: bal > 0 };
}

/* Level monthly payment that clears a balance exactly at maturity. */
function levelPaymentMonths(balance, annualRate, months) {
  const r = annualRate / 12;
  if (!(balance > 0 && months > 0)) return 0;
  return r > 0 ? (balance * r) / (1 - Math.pow(1 + r, -months)) : balance / months;
}

function extrasByYear(list, dest) {
  const m = {};
  (list || []).forEach((e) => {
    if (e.dest !== dest) return;
    const y = n(e.year, 0);
    if (!y) return;
    m[y] = (m[y] || 0) + n(e.amount);
  });
  return m;
}

/* ============================================================
   Balance sheet
   ============================================================ */

function balanceSheet(p) {
  const deferred = n(p.ira) + n(p.k401);
  const roth = n(p.roth);
  const hsa = n(p.hsa);
  const usableCash = Math.max(0, n(p.cash) - n(p.cashReserve));
  const taxable = n(p.funds) + n(p.vestedEquity) + n(p.vestedCarry) + usableCash;
  const retirementAccts = deferred + roth + hsa;
  const investable = retirementAccts + taxable;
  const homeEquity = n(p.homeValue) - n(p.mortgageBalance);
  const netWorth = investable + n(p.cashReserve) + homeEquity + n(p.fiveTwoNine);
  return { deferred, roth, hsa, taxable, usableCash, retirementAccts, investable, homeEquity, netWorth };
}

/* ============================================================
   Projection engine
   ============================================================ */

/* Withdraw `need` of spendable cash, walking the buckets in the order that costs
   least tax: taxable first (only the gain is taxed), then tax-deferred (ordinary
   income), then HSA and Roth last because they come out clean and are worth
   keeping. Returns the gross amount removed and the tax it carried. */
function drawByAccount(B, basis, need, ordRate, cgRate) {
  let left = need, gross = 0, tax = 0;

  if (left > 0 && B.taxable > 0) {
    const before = B.taxable;
    const gainFrac = before > 0 ? Math.max(0, before - basis.v) / before : 0;
    const eff = gainFrac * cgRate;                 // blended rate on a taxable sale
    const wanted = eff < 1 ? left / (1 - eff) : before;
    const take = Math.min(before, wanted);
    const net = take * (1 - eff);
    basis.v *= before > 0 ? 1 - take / before : 0; // basis leaves pro rata
    B.taxable = before - take;
    left -= net; gross += take; tax += take - net;
  }

  if (left > 0 && B.deferred > 0) {
    const wanted = ordRate < 1 ? left / (1 - ordRate) : B.deferred;
    const take = Math.min(B.deferred, wanted);
    const net = take * (1 - ordRate);
    B.deferred -= take;
    left -= net; gross += take; tax += take - net;
  }

  for (const k of ["hsa", "roth"]) {
    if (left > 0 && B[k] > 0) {
      const take = Math.min(B[k], left);
      B[k] -= take; left -= take; gross += take;
    }
  }

  return { gross, tax, shortfall: Math.max(0, left) };
}

/* Pro-rata withdrawal used by the simple single-rate mode. */
function drawPooled(B, basis, gross) {
  const total = B.roth + B.deferred + B.taxable + B.hsa;
  if (total <= 0) return { gross: 0, shortfall: gross };
  const take = Math.min(total, gross);
  const f = take / total;
  const beforeTaxable = B.taxable;
  B.roth -= B.roth * f; B.deferred -= B.deferred * f;
  B.taxable -= B.taxable * f; B.hsa -= B.hsa * f;
  if (beforeTaxable > 0) basis.v *= 1 - f;
  return { gross: take, shortfall: Math.max(0, gross - take) };
}

function project(profile, a, opts = {}) {
  const seq = opts.returns || null;
  const bs = balanceSheet(profile);
  const age0 = n(profile.currentAge, 40);
  const deathAge = Math.max(age0 + 1, n(a.deathAge, 92));
  const retAge = clamp(n(a.retirementAge, 65), age0, deathAge);
  const infl = n(a.inflation, 0.025);
  const preR = n(a.preReturn, 0.07);
  const postR = n(a.postReturn, 0.05);
  const blended = clamp(n(a.effectiveTaxRate, 0), 0, 0.6);
  const ordRate = clamp(n(a.ordinaryTaxRate, 0.22), 0, 0.7);
  const cgRate = clamp(n(a.capGainsRate, 0.15), 0, 0.5);
  const byAccount = a.taxMode === "byAccount";
  const spendIsGross = a.spendBasis !== "net";
  const ss = computeSS(profile, a);
  const ssTaxable = clamp(n(a.ssTaxablePortion, 0.85), 0, 1);
  const ssCola = a.ssCola !== false;          // benefits rise with inflation once claimed
  const spendInflates = a.spendInflates !== false;  // budgets rise with inflation

  /* --- opening buckets, scaled if an override total is set --- */
  const B = { roth: bs.roth, deferred: bs.deferred, taxable: bs.taxable, hsa: bs.hsa };
  if (a.assetsOverride !== "" && a.assetsOverride != null) {
    const want = n(a.assetsOverride), have = bs.investable;
    const f = have > 0 ? want / have : 0;
    if (have > 0) { B.roth *= f; B.deferred *= f; B.taxable *= f; B.hsa *= f; }
    else B.taxable = want;
  }
  const basis = { v: B.taxable * clamp(n(a.taxableBasisShare, 0.7), 0, 1) };

  /* --- contribution split; whatever is left of 100% lands in taxable --- */
  const splitDef = clamp(n(a.contribToDeferred, 0.5), 0, 1);
  const splitRoth = clamp(n(a.contribToRoth, 0.15), 0, 1);
  const splitHsa = clamp(n(a.contribToHSA, 0.05), 0, 1);
  const splitTax = Math.max(0, 1 - splitDef - splitRoth - splitHsa);

  /* --- mortgage --- */
  const years = deathAge - age0 + 1;
  const mortRate = n(profile.mortgageRate, 0);
  const mortStart = n(profile.mortgageBalance, 0);
  const matYear = n(profile.mortgageMaturityYear, 0);
  const matMonth = clamp(n(profile.mortgageMaturityMonth, 12), 1, 12);
  const mortMonths = matYear > 0 ? Math.max(0, (matYear - CY) * 12 + (matMonth - CM)) : 0;
  const firstYearMonths = Math.max(0, 12 - CM);
  const byMaturity = a.mortgageDriver !== "payment";
  const mortMonthly = (byMaturity && mortMonths > 0 && mortStart > 0)
    ? levelPaymentMonths(mortStart, mortRate, mortMonths)
    : n(profile.mortgagePayment, 0);
  const mortPay = mortMonthly * 12;
  const withExtraMap = extrasByYear(a.extras, "mortgage");
  const mortgageInSpend = a.mortgageInSpend === "added";
  const withExtra = amortize(mortStart, mortRate, mortMonthly, withExtraMap, CY, years, firstYearMonths);
  const noExtra = amortize(mortStart, mortRate, mortMonthly, {}, CY, years, firstYearMonths);
  let homeVal = (a.homeEquityOverride !== "" && a.homeEquityOverride != null)
    ? n(a.homeEquityOverride) + mortStart
    : n(profile.homeValue, 0);
  const portfolioExtras = extrasByYear(a.extras, "portfolio");

  /* --- contribution step-down --- */
  const stepOn = !!a.contribStepDown;
  const stepYear = n(a.contribStepYear, 0);
  const stepTo = n(a.contribStepTo, 0);

  let homeSold = false;
  const rows = [];
  let depletionAge = null, peak = 0;
  let cumSS = 0, cumSSNet = 0, cumDraw = 0, cumDrawNoSS = 0, cumContrib = 0,
      cumShort = 0, cumNeed = 0, cumCovered = 0, cumTax = 0, cumVest = 0, cumInflow = 0;

  for (let age = age0; age <= deathAge; age++) {
    const t = age - age0;
    const year = CY + t;
    const inf = Math.pow(1 + infl, t);
    const retired = age >= retAge;
    let r = seq && seq[age] != null ? seq[age] : (retired ? postR : preR);
    const feeOn = a.advisorFeeFrom !== "" && a.advisorFeeFrom != null && year >= n(a.advisorFeeFrom);
    const feeRate = feeOn ? clamp(n(a.advisorFee, 0), 0, 0.1) : 0;
    r = r - feeRate;                       // charged on the balance, so it comes off the return
    const boy = B.roth + B.deferred + B.taxable + B.hsa;
    const mort = withExtra.sched[t] || { balance: 0, interest: 0, extra: 0, principal: 0 };

    /* ---- contributions ---- */
    let contrib = 0;
    if (!retired) {
      if (stepOn && stepYear > 0 && year >= stepYear) {
        // flat from the step-down year onward, in today's dollars
        contrib = stepTo;
      } else {
        contrib = n(a.annualContribution) * Math.pow(1 + n(a.contributionGrowth), t);
      }
    }

    /* ---- vesting equities: land at the start of the year, at their own share ---- */
    let vestGross = 0, vest = 0;
    (profile.vesting || []).forEach((v) => {
      if (n(v.year, -1) === year) {
        const amt = n(v.amount);
        vestGross += amt;
        vest += amt * clamp(n(v.prob, 100) / 100, 0, 1);
      }
    });

    /* ---- one-off cash inflows: same shape, own contributed share ---- */
    let inflowGross = 0, inflowIn = 0;
    (a.cashInflows || []).forEach((c) => {
      if (n(c.year, -1) === year) {
        const amt = n(c.amount);
        inflowGross += amt;
        inflowIn += amt * clamp(n(c.pct, 100) / 100, 0, 1);
      }
    });

    /* ---- house sale ---- */
    let homeProceeds = 0;
    if (!homeSold && a.sellHomeAge !== "" && a.sellHomeAge != null && age === n(a.sellHomeAge)) {
      homeProceeds = Math.max(0, homeVal - mort.balance) * clamp(n(a.homeReleasePct, 0.85), 0, 1);
      homeSold = true;
    }
    const extraIn = portfolioExtras[year] || 0;

    /* Vesting arrives at the start of the year, so it earns a full year of return.
       Everything else is treated as arriving through the year. */
    const boyIn = vest;
    const midIn = contrib + inflowIn + extraIn + homeProceeds;

    B.taxable += boyIn;                          // shares and cash land taxable
    basis.v += boyIn;                            // and arrive at full basis
    B.deferred += contrib * splitDef;
    B.roth += contrib * splitRoth;
    B.hsa += contrib * splitHsa;
    B.taxable += contrib * splitTax + inflowIn + extraIn + homeProceeds;
    basis.v += contrib * splitTax + inflowIn + extraIn + homeProceeds;

    /* ---- spending ---- */
    let spend = 0, mortSpend = 0;
    if (retired) {
      const yi = age - retAge;
      const yearsA = n(a.budgetA.years, 0);
      const baseAmt = yi < yearsA ? n(a.budgetA.amount) : n(a.budgetB.amount);
      spend = baseAmt * (spendInflates ? inf : 1);
      if (mortgageInSpend && !homeSold) {
        mortSpend = mort.interest + mort.principal;   // fixed nominal, never inflates
        spend += mortSpend;
      }
    }
    let oneOff = 0;
    (a.oneOffs || []).forEach((o) => {
      if (o.age !== "" && n(o.age, -1) === age) oneOff += n(o.amount) * (spendInflates ? inf : 1);
    });

    /* ---- Social Security ---- */
    const ssGross = age >= ss.claimAge ? ss.annualAtClaim * (ssCola ? inf : 1) : 0;
    const ssApplied = byAccount
      ? ssGross * (1 - ordRate * ssTaxable)
      : (spendIsGross ? ssGross : ssGross * (1 - blended * ssTaxable));

    const need = spend + oneOff;
    const coveredBySS = Math.min(need, ssApplied);
    const surplusSS = ssApplied - coveredBySS;
    const netNeed = Math.max(0, need - ssApplied);

    if (surplusSS > 0) { B.taxable += surplusSS; basis.v += surplusSS; }

    /* ---- withdrawal ---- */
    let grossDraw = 0, taxPaid = 0, shortfall = 0, drawNoSS = 0;
    if (byAccount) {
      const res = drawByAccount(B, basis, netNeed, ordRate, cgRate);
      grossDraw = res.gross; taxPaid = res.tax; shortfall = res.shortfall;
      drawNoSS = need;
    } else {
      const want = netNeed > 0 ? (spendIsGross ? netNeed : netNeed / (1 - blended)) : 0;
      const res = drawPooled(B, basis, want);
      grossDraw = res.gross; shortfall = res.shortfall;
      taxPaid = spendIsGross ? 0 : grossDraw * blended;
      drawNoSS = need > 0 ? (spendIsGross ? need : need / (1 - blended)) : 0;
    }
    if (shortfall > 0 && depletionAge === null) depletionAge = age;
    cumShort += shortfall;

    /* ---- growth ---- */
    const preGrowth = B.roth + B.deferred + B.taxable + B.hsa;
    const gBoy = 1 + r;
    const gMid = Math.sqrt(Math.max(0.2, 1 + r));
    // Opening balance and start-of-year money earn the full year; the rest half.
    const openPart = Math.max(0, boy + boyIn - 0);
    const flowPart = preGrowth - openPart;
    const grown = openPart * gBoy + flowPart * gMid;
    const factor = preGrowth > 0 ? grown / preGrowth : 1;
    B.roth *= factor; B.deferred *= factor; B.taxable *= factor; B.hsa *= factor;
    // Growth inside the taxable bucket is unrealised gain, so basis stays put.

    const eoy = Math.max(0, B.roth + B.deferred + B.taxable + B.hsa);
    if (basis.v > B.taxable) basis.v = B.taxable;

    if (!homeSold) {
      homeVal = homeVal * (1 + n(a.homeAppreciation, 0));
      if (a.homeValueCap !== "" && a.homeValueCap != null) homeVal = Math.min(homeVal, n(a.homeValueCap));
    }
    const homeEq = homeSold ? 0 : Math.max(0, homeVal - mort.balance);

    cumSS += ssGross; cumSSNet += ssApplied; cumNeed += need; cumCovered += coveredBySS;
    cumDraw += grossDraw; cumDrawNoSS += drawNoSS; cumContrib += contrib; cumTax += taxPaid;
    cumVest += vest; cumInflow += inflowIn;
    peak = Math.max(peak, eoy);

    rows.push({
      year, age, t, inf, retired,
      boy, contrib, vest, vestGross, inflowIn, inflowGross, extraIn, homeProceeds,
      inflows: boyIn + midIn + surplusSS,
      growth: eoy - preGrowth,
      spend, oneOff, need, mortSpend,
      ss: ssGross, ssNet: ssApplied, coveredBySS, netNeed,
      taxDrag: taxPaid, grossDraw, drawNoSS, shortfall, eoy,
      advisorFee: feeRate > 0 ? (boy + boyIn) * feeRate : 0,
      roth: B.roth, deferred: B.deferred, taxable: B.taxable, hsa: B.hsa, basis: basis.v,
      mortBalance: homeSold ? 0 : mort.balance,
      mortInterest: mort.interest, mortExtra: mort.extra,
      homeVal: homeSold ? 0 : homeVal, homeEq,
      estate: eoy + homeEq,
    });
  }

  const last = rows[rows.length - 1] || {};
  const retRow = rows.find((r) => r.age === retAge);
  const goalYear = n(a.legacyGoalYear, CY);
  const deathYear = CY + (deathAge - age0);
  const goalNominal = n(a.legacyGoal) * Math.pow(1 + infl, deathYear - goalYear);
  const firstDrawRow = rows.find((r) => r.retired && r.grossDraw > 0);
  const withdrawalRate = firstDrawRow && firstDrawRow.boy > 0 ? firstDrawRow.grossDraw / firstDrawRow.boy : 0;
  const realPostReturn = (1 + postR) / (1 + infl) - 1;
  const realPreReturn = (1 + preR) / (1 + infl) - 1;
  const breakEvenAge = (() => {
    const r = rows.find((x) => x.retired && x.eoy > x.boy && x.grossDraw > 0);
    return r ? r.age : null;
  })();
  const budgetAAge = retAge;
  const budgetBAge = retAge + n(a.budgetA.years, 0);
  const bRowA = rows.find((r) => r.age === budgetAAge);
  const bRowB = rows.find((r) => r.age === budgetBAge);

  return {
    rows, ss, bs, depletionAge, peak, retAge, deathAge, age0, infl,
    startingAssets: rows[0] ? rows[0].boy : 0,
    portfolioAtRetirement: retRow ? retRow.boy : 0,
    terminalPortfolio: last.eoy || 0,
    terminalEstate: last.estate || 0,
    goalNominal, goalYear, deathYear,
    legacyGap: (last.estate || 0) - goalNominal,
    cumSS, cumSSNet, cumDraw, cumDrawNoSS, cumContrib, cumShort, cumNeed, cumCovered,
    cumTax, cumVest, cumInflow,
    ssCoverage: cumNeed > 0 ? cumCovered / cumNeed : 0,
    drawSavedBySS: cumDrawNoSS - cumDraw,
    withdrawalRate, realPostReturn, realPreReturn, breakEvenAge,
    spendIsGross, byAccount, ssCola, spendInflates,
    advisorFeeOn: a.advisorFeeFrom !== "" && a.advisorFeeFrom != null && n(a.advisorFee, 0) > 0,
    advisorFeeFrom: n(a.advisorFeeFrom, 0), advisorFeeRate: n(a.advisorFee, 0),
    cumAdvisorFee: rows.reduce((s2, x) => s2 + (x.advisorFee || 0), 0),
    budgetARate: bRowA && bRowA.boy > 0 ? (n(a.budgetA.amount) * bRowA.inf) / bRowA.boy : null,
    budgetBRate: bRowB && bRowB.boy > 0 ? (n(a.budgetB.amount) * bRowB.inf) / bRowB.boy : null,
    budgetADraw: bRowA && bRowA.boy > 0 ? bRowA.grossDraw / bRowA.boy : null,
    budgetBDraw: bRowB && bRowB.boy > 0 ? bRowB.grossDraw / bRowB.boy : null,
    budgetAAge, budgetBAge,
    portfolioAtBudgetA: bRowA ? bRowA.boy : 0,
    portfolioAtBudgetB: bRowB ? bRowB.boy : 0,
    mortgageInSpend,
    mortRetirementYears: withExtra.payoffOffset != null
      ? Math.max(0, (age0 + withExtra.payoffOffset) - retAge + 1) : Math.max(0, deathAge - retAge + 1),
    mortRetirementDraw: rows.reduce((s2, r) => s2 + (r.retired ? r.mortSpend : 0), 0),
    mortPayoffAge: withExtra.payoffOffset != null ? age0 + withExtra.payoffOffset : null,
    mortPayoffAgeBase: noExtra.payoffOffset != null ? age0 + noExtra.payoffOffset : null,
    mortInterestTotal: withExtra.totalInterest,
    mortInterestBase: noExtra.totalInterest,
    interestSaved: noExtra.totalInterest - withExtra.totalInterest,
    annualMortgagePayment: mortPay, monthlyMortgagePayment: mortMonthly, byMaturity,
    mortMonths, matYear, matMonth,
    vestScheduled: rows.reduce((s2, r) => s2 + r.vestGross, 0),
    vestDirected: cumVest,
    inflowScheduled: rows.reduce((s2, r) => s2 + r.inflowGross, 0),
    inflowDirected: cumInflow,
    extraToPortfolio: rows.reduce((s2, r) => s2 + r.extraIn, 0),
    extraToMortgage: rows.reduce((s2, r) => s2 + r.mortExtra, 0),
  };
}

/* ============================================================
   Sequence-of-returns stress test
   ============================================================ */

/* Equity share at a given age, after applying any step-downs that have taken effect.
   Steps are read in age order, so the last one reached wins. */
function equityAt(age, cfg) {
  let e = clamp(n(cfg.equityShare, 0.9), 0, 1);
  const steps = (cfg.steps || [])
    .filter((x) => x.age !== "" && x.age != null && n(x.age) > 0)
    .slice()
    .sort((a, b) => n(a.age) - n(b.age));
  steps.forEach((x) => { if (age >= n(x.age)) e = clamp(n(x.pct), 0, 1); });
  return e;
}

function buildReturnMap(a, cfg, startIdx, anchorAge) {
  const infl = n(a.inflation, 0.025);
  const other = n(cfg.otherReal, 0.02);
  const nominalMode = cfg.mode === "nominal";
  const otherNominal = (1 + other) * (1 + infl) - 1;
  const map = {};
  for (let i = 0; i < SEQ_LEN; i++) {
    const h = HIST[(startIdx + i) % HISTN];
    const age = anchorAge + i;
    const eq = equityAt(age, cfg);
    const nom = h[1] / 100, cpi = h[2] / 100;
    if (nominalMode) {
      map[age] = eq * nom + (1 - eq) * otherNominal;
    } else {
      const realEq = (1 + nom) / (1 + cpi) - 1;
      const blendReal = eq * realEq + (1 - eq) * other;
      map[age] = (1 + blendReal) * (1 + infl) - 1;
    }
  }
  return map;
}

function stressTest(profile, a, cfg) {
  const infl = n(a.inflation, 0.025);
  const age0 = n(profile.currentAge, 40);
  const deathAge = Math.max(age0 + 1, n(a.deathAge, 92));
  const retAge = clamp(n(a.retirementAge, 65), age0, deathAge);

  const startYears = cfg.window === "complete"
    ? HIST.filter((h) => h[0] + SEQ_LEN - 1 <= HIST[HISTN - 1][0]).map((h) => h[0])
    : HIST.slice(Math.max(0, HISTN - 70)).map((h) => h[0]);

  const runs = [];
  startYears.forEach((sy) => {
    const idx = sy - HIST0;
    const wrapped = idx + SEQ_LEN > HISTN;
    cfg.anchors.forEach((off) => {
      const anchorAge = retAge + off;
      const pr = project(profile, a, { returns: buildReturnMap(a, cfg, idx, anchorAge) });
      runs.push({
        startYear: sy, anchor: off, wrapped, era: ERA(sy),
        depletionAge: pr.depletionAge,
        terminal: pr.terminalPortfolio,
        estate: pr.terminalEstate,
        rows: pr.rows,
      });
    });
  });
  return { runs, startYears, retAge, deathAge, age0, infl };
}

function summarize(runs, anchor) {
  const set = runs.filter((r) => r.anchor === anchor);
  if (!set.length) return null;
  const survived = set.filter((r) => r.depletionAge == null);
  const failed = set.filter((r) => r.depletionAge != null);
  const ests = set.map((r) => r.terminal).sort((x, y) => x - y);
  const q = (p) => ests[clamp(Math.round(p * (ests.length - 1)), 0, ests.length - 1)];
  const deps = failed.map((r) => r.depletionAge).sort((x, y) => x - y);
  const worst = set.slice().sort((x, y) =>
    (x.depletionAge ?? 999) - (y.depletionAge ?? 999) || x.terminal - y.terminal)[0];
  const best = set.slice().sort((x, y) => y.terminal - x.terminal)[0];
  return {
    n: set.length,
    survived: survived.length,
    rate: survived.length / set.length,
    p10: q(0.1), p50: q(0.5), p90: q(0.9),
    worst, best,
    earliestDep: deps.length ? deps[0] : null,
    medianDep: deps.length ? deps[Math.floor(deps.length / 2)] : null,
    latestDep: deps.length ? deps[deps.length - 1] : null,
  };
}

function fanData(runs, anchor, ages, infl, age0) {
  const set = runs.filter((r) => r.anchor === anchor);
  return ages.map((age) => {
    const vals = [];
    set.forEach((r) => {
      const row = r.rows.find((x) => x.age === age);
      if (row) vals.push(row.eoy);
    });
    vals.sort((x, y) => x - y);
    const q = (p) => (vals.length ? vals[clamp(Math.round(p * (vals.length - 1)), 0, vals.length - 1)] : 0);
    return {
      age,
      band: [Math.round(q(0.1)), Math.round(q(0.9))],
      median: Math.round(q(0.5)),
      worst: Math.round(q(0)),
    };
  });
}

/* ---------- solvers ---------- */
function solveContribution(profile, a) {
  const f = (c) => project(profile, { ...a, annualContribution: c }).legacyGap;
  if (f(0) >= 0) return 0;
  let lo = 0, hi = 50000;
  for (let i = 0; i < 40 && f(hi) < 0; i++) hi *= 1.6;
  if (f(hi) < 0) return null;
  for (let i = 0; i < 60; i++) {
    const mid = (lo + hi) / 2;
    if (f(mid) < 0) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}
function solveRetirementAge(profile, a) {
  const start = n(profile.currentAge, 40), end = n(a.deathAge, 92) - 1;
  for (let age = start; age <= end; age++) {
    if (project(profile, { ...a, retirementAge: age }).legacyGap >= 0) return age;
  }
  return null;
}
function solveReturn(profile, a) {
  const spread = n(a.preReturn) - n(a.postReturn);
  const f = (r) => project(profile, { ...a, preReturn: r, postReturn: Math.max(0, r - spread) }).legacyGap;
  if (f(0.20) < 0) return null;
  if (f(0) >= 0) return 0;
  let lo = 0, hi = 0.2;
  for (let i = 0; i < 60; i++) {
    const mid = (lo + hi) / 2;
    if (f(mid) < 0) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}

/* Browser storage. Everything stays on this device, in this browser profile.
   Nothing is uploaded anywhere and nothing is baked into this file. Clearing
   site data will erase it, so use the Backup button now and then. */
function loadState() {
  try {
    const v = window.localStorage.getItem(KEY);
    return { ok: true, data: v ? JSON.parse(v) : null, error: null };
  } catch (e) {
    return { ok: false, data: null, error: (e && e.message) || "Storage blocked" };
  }
}

function persist(state) {
  try {
    window.localStorage.setItem(KEY, JSON.stringify(state));
    return { ok: true, error: null };
  } catch (e) {
    return { ok: false, error: (e && e.message) || "Storage blocked" };
  }
}

const pathGet = (obj, path) => path.split(".").reduce((o, k) => (o == null ? undefined : o[k]), obj);
const pathSet = (obj, path, val) => {
  const keys = path.split(".");
  const out = { ...obj };
  let cur = out;
  for (let i = 0; i < keys.length - 1; i++) {
    cur[keys[i]] = { ...cur[keys[i]] };
    cur = cur[keys[i]];
  }
  cur[keys[keys.length - 1]] = val;
  return out;
};

/* ============================================================
   Primitives
   ============================================================ */

/* Inputs hold a local draft while focused and only push the value up on blur or
   Enter. Escape abandons the edit. This keeps a keystroke from re-running the
   whole projection and from remounting the field underneath the cursor. */
function useDraft(value, onChange, format) {
  const [draft, setDraft] = useState(null);
  const display = draft != null ? draft : format(value);
  const commit = () => {
    if (draft == null) return;
    onChange(draft);
    setDraft(null);
  };
  const onKeyDown = (e) => {
    if (e.key === "Enter") { commit(); e.target.blur(); }
    if (e.key === "Escape") { setDraft(null); e.target.blur(); }
  };
  return { display, onChange: (e) => setDraft(e.target.value), onBlur: commit, onKeyDown };
}

function Num({ value, onChange, prefix, suffix, w = "", placeholder, disabled }) {
  const d = useDraft(value, (s) => onChange(s.trim() === "" ? "" : n(s)),
    (v) => (v === "" || v == null ? "" : Number(v).toLocaleString()));
  return (
    <span className="affix">
      {prefix && <span>{prefix}</span>}
      <input className={"inp " + w} inputMode="decimal" disabled={disabled} placeholder={placeholder}
        value={d.display} onChange={d.onChange} onBlur={d.onBlur} onKeyDown={d.onKeyDown} />
      {suffix && <span>{suffix}</span>}
    </span>
  );
}

function Pctf({ value, onChange, w = "sm" }) {
  const d = useDraft(value, (s) => onChange(s.trim() === "" ? "" : n(s) / 100),
    (v) => (v === "" || v == null ? "" : String(+(Number(v) * 100).toFixed(3))));
  return (
    <span className="affix">
      <input className={"inp " + w} inputMode="decimal"
        value={d.display} onChange={d.onChange} onBlur={d.onBlur} onKeyDown={d.onKeyDown} />
      <span>%</span>
    </span>
  );
}

function YearNum({ value, onChange, w = "xs", placeholder }) {
  const d = useDraft(value, (s) => onChange(s.trim() === "" ? "" : n(s)),
    (v) => (v === "" || v == null ? "" : String(v)));
  return (
    <input className={"inp " + w} inputMode="numeric" placeholder={placeholder}
      value={d.display} onChange={d.onChange} onBlur={d.onBlur} onKeyDown={d.onKeyDown} />
  );
}

function Txt({ value, onChange, placeholder, style, w = "inp txt" }) {
  const d = useDraft(value, onChange, (v) => v ?? "");
  return (
    <input className={w} style={style} placeholder={placeholder}
      value={d.display} onChange={d.onChange} onBlur={d.onBlur} onKeyDown={d.onKeyDown} />
  );
}

/* Older saved plans predate some of these tables, so always render a full set of
   rows rather than however many happen to be stored. */
function padRows(list, count, blank) {
  const out = (list || []).map((x) => ({ id: x.id || uid(), ...blank, ...x })).slice(0, count);
  while (out.length < count) out.push({ id: uid(), ...blank });
  return out;
}

/* A saved plan may predate one of these tables entirely, so top every list back up
   to its full length once at load rather than at render — otherwise the row indexes
   and the stored array drift apart. */
function normalize(st) {
  const pr = { ...DEFAULT_PROFILE, ...(st.profile || {}) };
  const as = { ...DEFAULT_ASSUMPTIONS, ...(st.assumptions || {}) };
  pr.vesting = padRows(pr.vesting, 10, { label: "", amount: "", year: "", prob: 100 });
  as.cashInflows = padRows(as.cashInflows, 10, { label: "", amount: "", year: "", pct: 100 });
  as.oneOffs = padRows(as.oneOffs, 10, { label: "", amount: "", age: "" });
  as.extras = padRows(as.extras, 6, { label: "", amount: "", year: "", dest: "portfolio" });
  return { ...DEFAULT_STATE, ...st, profile: pr, assumptions: as,
    ui: { ...DEFAULT_STATE.ui, ...(st.ui || {}) },
    stress: { ...DEFAULT_STATE.stress, ...(st.stress || {}) } };
}

function Area2({ value, onChange, placeholder, rows = 10 }) {
  const d = useDraft(value, onChange, (v) => v ?? "");
  return (
    <textarea className="ta" rows={rows} placeholder={placeholder}
      value={d.display} onChange={d.onChange} onBlur={d.onBlur} />
  );
}

const R = ({ label, hint, children }) => (
  <div className="r">
    <label className="lb">{label}{hint && <span className="hint">{hint}</span>}</label>
    <div className="vl">{children}</div>
  </div>
);

const H = ({ children }) => <div className="hdr">{children}</div>;

function Group({ id, title, summary, open, toggle, children, lead, warn, warnNote }) {
  return (
    <div className={"grp" + (warn ? " warnbox" : "")}>
      <button className={"grph" + (open ? " open" : "")} onClick={() => toggle(id)}>
        <span className="chev">▶</span>
        <span className="ttl">{title}</span>
        {!open && summary != null && <span className="sum">{summary}</span>}
        {warn && <span className="sum" style={{ color: "#9A5B12", marginLeft: 8 }}>check</span>}
      </button>
      {open && (
        <div className="grpb">
          {warn && warnNote && <div className="warnnote">{warnNote}</div>}
          {lead && <div className="lead-in">{lead}</div>}
          {children}
        </div>
      )}
    </div>
  );
}

/* ============================================================
   Explore — levers, payments, annual worksheet
   ============================================================ */

const blankSheet = () => ({
  income: Array.from({ length: 5 }, () => ({ id: uid(), label: "", amount: "" })),
  buckets: Array.from({ length: 8 }, () => ({ id: uid(), label: "", amount: "", kind: "spend" })),
});

function growTo(amount, fromAge, toAge, retAge, preR, postR) {
  let v = amount;
  for (let age = Math.round(fromAge); age < Math.round(toAge); age++) v *= 1 + (age >= retAge ? postR : preR);
  return v;
}

/* Defined at module scope. A component declared inside a render body gets a new
   identity on every pass, which makes React unmount and remount it — and any
   input inside loses focus mid-keystroke. */
const Delta = ({ v }) => Math.abs(v) < 1
  ? <span className="mut">no change</span>
  : <span className={v > 0 ? "pos" : "neg"}>{(v > 0 ? "+" : "\u2212") + moneyShort(Math.abs(v))}</span>;

function LeverValue({ f, value, set }) {
  if (f.t === "choice") return (
    <select className="inp sel" value={String(value)}
      onChange={(e) => set(f.opts[0][0] === true ? e.target.value === "true" : e.target.value)}>
      {f.opts.map(([val, lab]) => <option key={String(val)} value={String(val)}>{lab}</option>)}
    </select>
  );
  if (f.t === "pct") return <Pctf value={value} onChange={set} />;
  if (f.t === "year") return <YearNum value={value} w="sm" onChange={set} />;
  if (f.t === "num") return <Num value={value} w="xs" onChange={set} />;
  return <Num value={value} prefix="$" w="sm" onChange={set} />;
}

function Lever({ slot, lever, m, mBase, orig, accent, setLever, pick }) {
  const f = FIELD_BY_KEY[lever.k];
  const set = (v) => setLever(slot, { v });
  const fmtV = (v) => {
    if (!f) return "";
    if (f.t === "choice") return (f.opts.find((o) => String(o[0]) === String(v)) || [, "\u2014"])[1];
    if (v === "" || v == null) return "blank";
    if (f.t === "pct") return pct(n(v));
    if (f.t === "money") return money(n(v));
    return String(v);
  };
  return (
    <div className="card" style={{ marginTop: 9, borderLeft: `3px solid ${accent}` }}>
      <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
        <select className="inp txt" style={{ flex: "1 1 160px", minWidth: 0 }}
          value={lever.k} onChange={(e) => pick(slot, e.target.value)}>
          <option value="">Choose a field\u2026</option>
          {Object.entries(FIELD_GROUPS).map(([g, list]) => (
            <optgroup key={g} label={g}>
              {list.map((fd) => <option key={fd.k} value={fd.k}>{fd.l}</option>)}
            </optgroup>
          ))}
        </select>
        {f && <LeverValue f={f} value={lever.v} set={set} />}
        {f && <button className="btn gh sm" onClick={() => set(orig)}>reset</button>}
      </div>
      {f && m && (
        <>
          <div className="note" style={{ marginTop: 7 }}>{fmtV(orig)} \u2192 <span className="br">{fmtV(lever.v)}</span></div>
          <div style={{ display: "flex", gap: 22, marginTop: 8, flexWrap: "wrap" }}>
            <div><div className="k">At {m.retAge}</div>
              <div className="fig" style={{ fontSize: 17 }}>{moneyShort(m.atRet)}</div>
              <div style={{ fontSize: 11 }}><Delta v={m.atRet - mBase.atRet} /></div></div>
            <div><div className="k">At {m.deathAge}</div>
              <div className="fig" style={{ fontSize: 17 }}>{moneyShort(m.atDeath)}</div>
              <div style={{ fontSize: 11 }}><Delta v={m.atDeath - mBase.atDeath} /></div></div>
            <div><div className="k">Runs dry</div>
              <div className={"fig " + (m.dry ? "neg" : "pos")} style={{ fontSize: 17 }}>{m.dry || "never"}</div>
              <div style={{ fontSize: 11 }} className="mut">
                {m.dry === mBase.dry ? "unchanged" : mBase.dry ? `was ${mBase.dry}` : "was never"}</div></div>
          </div>
        </>
      )}
    </div>
  );
}

function ExploreTab({ state, setA, setState, proj, open, toggle }) {
  const a = state.assumptions, p = state.profile;
  const base = { profile: p, assumptions: a };

  /* Lever state is scratch, so it lives here rather than in saved state. Keeping it
     local removes the stale-closure bugs that made this tab misbehave. */
  const [lv, setLv] = useState({ a: { k: "", v: null }, b: { k: "", v: null } });
  const setLever = (slot, patch) => setLv((s) => ({ ...s, [slot]: { ...s[slot], ...patch } }));
  const pick = (slot, key) => setLever(slot, { k: key, v: key ? pathGet(base, key) : null });

  const metrics = (pr) => ({
    atRet: pr.portfolioAtRetirement, atDeath: pr.terminalPortfolio,
    dry: pr.depletionAge, retAge: pr.retAge, deathAge: pr.deathAge,
  });
  const mBase = metrics(proj);
  const runLever = (l) => {
    if (!l.k) return null;
    const st = pathSet(base, l.k, l.v);
    return project(st.profile, st.assumptions);
  };
  const projA = runLever(lv.a), projB = runLever(lv.b);
  let bothSt = base;
  if (lv.a.k) bothSt = pathSet(bothSt, lv.a.k, lv.a.v);
  if (lv.b.k) bothSt = pathSet(bothSt, lv.b.k, lv.b.v);
  const projBoth = lv.a.k && lv.b.k ? project(bothSt.profile, bothSt.assumptions) : null;

  const extras = a.extras || [];
  const setExtra = (i, patch) => setA({ extras: extras.map((x, j) => (j === i ? { ...x, ...patch } : x)) });
  const anyExtras = extras.some((x) => n(x.amount) > 0 && n(x.year) > 0);
  const allTo = (dest) => extras.map((x) => (n(x.amount) ? { ...x, dest } : x));
  const routes = [
    { k: "asis", nm: "As entered", pr: proj },
    { k: "port", nm: "All to investments", pr: project(p, { ...a, extras: allTo("portfolio") }) },
    { k: "mort", nm: "All to mortgage", pr: project(p, { ...a, extras: allTo("mortgage") }) },
  ];

  const annual = state.annual || { year: CY, sheets: {} };
  const yr = n(annual.year, CY);
  const sheet = annual.sheets[yr] || blankSheet();
  const setAnnual = (patch) => setState((s) => ({ ...s, annual: { ...(s.annual || { year: CY, sheets: {} }), ...patch } }));
  const setSheet = (patch) => setState((s) => {
    const an = s.annual || { year: CY, sheets: {} }; const y = n(an.year, CY);
    return { ...s, annual: { ...an, sheets: { ...an.sheets, [y]: { ...(an.sheets[y] || blankSheet()), ...patch } } } };
  });
  const ageY = n(p.currentAge) + (yr - CY);
  const atRetV = (amt) => growTo(amt, ageY, proj.retAge, proj.retAge, n(a.preReturn), n(a.postReturn));
  const atDeathV = (amt) => growTo(amt, ageY, proj.deathAge, proj.retAge, n(a.preReturn), n(a.postReturn));
  const income = sheet.income.reduce((s, r) => s + n(r.amount), 0);
  const invested = sheet.buckets.filter((b) => b.kind === "investment").reduce((s, b) => s + n(b.amount), 0);
  const spentB = sheet.buckets.filter((b) => b.kind === "spend").reduce((s, b) => s + n(b.amount), 0);
  const leftOver = income - invested - spentB;
  const filledYears = Object.keys(annual.sheets).map(Number).sort((x, y) => x - y);

  return (
    <>
      <H>One decision at a time</H>
      <div className="note" style={{ paddingBottom: 4 }}>
        Change any field without touching your actual inputs. Baseline is {moneyShort(mBase.atRet)} at {mBase.retAge} and{" "}
        {moneyShort(mBase.atDeath)} at {mBase.deathAge}, in the dollars of those years.
      </div>
      <Lever slot="a" lever={lv.a} m={projA ? metrics(projA) : null} mBase={mBase}
        orig={lv.a.k ? pathGet(base, lv.a.k) : null} accent="#9A7526" setLever={setLever} pick={pick} />
      <Lever slot="b" lever={lv.b} m={projB ? metrics(projB) : null} mBase={mBase}
        orig={lv.b.k ? pathGet(base, lv.b.k) : null} accent="#3D6AA6" setLever={setLever} pick={pick} />
      {projBoth && (
        <div className="card" style={{ marginTop: 9, borderLeft: "3px solid #1E7A5A" }}>
          <div className="k">Both together</div>
          <div style={{ display: "flex", gap: 22, marginTop: 5, flexWrap: "wrap" }}>
            <div><div className="k">At {proj.retAge}</div>
              <div className="fig" style={{ fontSize: 17 }}>{moneyShort(metrics(projBoth).atRet)}</div>
              <div style={{ fontSize: 11 }}><Delta v={metrics(projBoth).atRet - mBase.atRet} /></div></div>
            <div><div className="k">At {proj.deathAge}</div>
              <div className="fig" style={{ fontSize: 17 }}>{moneyShort(metrics(projBoth).atDeath)}</div>
              <div style={{ fontSize: 11 }}><Delta v={metrics(projBoth).atDeath - mBase.atDeath} /></div></div>
          </div>
          <div className="note" style={{ marginTop: 6 }}>
            {(() => {
              const both = metrics(projBoth).atDeath - mBase.atDeath;
              const sum = (projA ? metrics(projA).atDeath - mBase.atDeath : 0) + (projB ? metrics(projB).atDeath - mBase.atDeath : 0);
              const diff = both - sum;
              return Math.abs(both) < 1 || Math.abs(diff) < Math.abs(both) * 0.02
                ? "The two are close to additive."
                : `Together they're worth ${moneyShort(Math.abs(diff))} ${diff > 0 ? "more" : "less"} than separately — they compound on each other.`;
            })()}
          </div>
        </div>
      )}

      <div style={{ height: 16 }} />

      <Group id="pay" title="One-off payments" open={open.pay} toggle={toggle}
        summary={extras.filter((x) => n(x.amount) > 0).length + " entered"}
        lead="Lump sums from outside — a bonus, a distribution, a sale. Send each to investments or at the mortgage.">
        {extras.map((e, i) => (
          <div className="r" key={e.id}>
            <Txt placeholder={`Payment ${i + 1}`} value={e.label} onChange={(t) => setExtra(i, { label: t })} />
            <div className="vl" style={{ display: "flex", gap: 5 }}>
              <Num value={e.amount} prefix="$" w="sm" onChange={(v) => setExtra(i, { amount: v })} />
              <YearNum value={e.year} placeholder="yr" w="xs" onChange={(v) => setExtra(i, { year: v })} />
              <select className="inp sel" value={e.dest} onChange={(ev) => setExtra(i, { dest: ev.target.value })}>
                <option value="portfolio">investments</option>
                <option value="mortgage">mortgage</option>
              </select>
            </div>
          </div>
        ))}
        {anyExtras && (
          <>
            <div className="scr" style={{ maxHeight: "none", marginTop: 10 }}>
              <table className="t">
                <thead><tr><th>Route it</th><th>At {proj.retAge}</th><th>At {proj.deathAge}</th><th>Interest saved</th></tr></thead>
                <tbody>
                  {routes.map((v) => (
                    <tr key={v.k}>
                      <td>{v.nm}</td>
                      <td>{moneyShort(v.pr.portfolioAtRetirement)}</td>
                      <td className="fig">{moneyShort(v.pr.terminalPortfolio)}</td>
                      <td className={v.pr.interestSaved > 0 ? "pos" : "mut"}>
                        {v.pr.interestSaved > 0 ? moneyShort(v.pr.interestSaved) : "\u2014"}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div className="note" style={{ marginTop: 8 }}>
              Your mortgage payment isn't a portfolio outflow, so interest you avoid can't show up in the portfolio
              figure. Investments compound at {pct(n(a.postReturn))} and might not; the mortgage returns a certain{" "}
              {pct(n(p.mortgageRate))}.
            </div>
          </>
        )}
      </Group>

      <Group id="annual" title="Year worksheet" open={open.annual} toggle={toggle}
        summary={filledYears.length ? filledYears.length + " years mapped" : "none yet"}
        lead="Map one year's income into buckets you name. A scratch pad — nothing here feeds the projection.">
        <R label="Planning for" hint={`You'd be ${ageY}${ageY >= proj.retAge ? ", retired" : ""}`}>
          <YearNum value={annual.year} w="sm" onChange={(v) => setAnnual({ year: v })} /></R>
        {filledYears.length > 0 && (
          <div style={{ display: "flex", gap: 5, flexWrap: "wrap", padding: "6px 0" }}>
            {filledYears.map((y) => (
              <button key={y} className={"btn sm " + (y === yr ? "pri" : "gh")} onClick={() => setAnnual({ year: y })}>{y}</button>
            ))}
          </div>
        )}
        <div className="lead-in" style={{ paddingTop: 8 }}>Coming in</div>
        {sheet.income.map((r, i) => (
          <div className="r" key={r.id}>
            <Txt placeholder={i === 0 ? "Salary" : i === 1 ? "Bonus" : `Source ${i + 1}`} value={r.label}
              onChange={(t) => setSheet({ income: sheet.income.map((x, j) => j === i ? { ...x, label: t } : x) })} />
            <div className="vl"><Num value={r.amount} prefix="$"
              onChange={(v) => setSheet({ income: sheet.income.map((x, j) => j === i ? { ...x, amount: v } : x) })} /></div>
          </div>
        ))}
        <R label="Total"><span className="affix fig br">{money(income)}</span></R>
        <div className="lead-in" style={{ paddingTop: 10 }}>Where it goes</div>
        {sheet.buckets.map((b, i) => {
          const amt = n(b.amount), isInv = b.kind === "investment";
          return (
            <div key={b.id} style={{ padding: "5px 0", borderTop: "1px solid #F0EDE6" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 7 }}>
                <Txt placeholder={`Bucket ${i + 1}`} value={b.label}
                  onChange={(t) => setSheet({ buckets: sheet.buckets.map((x, j) => j === i ? { ...x, label: t } : x) })} />
                <Num value={b.amount} prefix="$" w="sm"
                  onChange={(v) => setSheet({ buckets: sheet.buckets.map((x, j) => j === i ? { ...x, amount: v } : x) })} />
                <select className="inp sel" style={{ width: 96 }} value={b.kind}
                  onChange={(e) => setSheet({ buckets: sheet.buckets.map((x, j) => j === i ? { ...x, kind: e.target.value } : x) })}>
                  <option value="spend">spend</option><option value="investment">invest</option>
                </select>
              </div>
              {isInv && amt > 0 && (
                <div className="note" style={{ marginTop: 2 }}>
                  becomes {ageY < proj.retAge && <><span className="pos">{money(atRetV(amt))}</span> at {proj.retAge} \u00b7 </>}
                  <span className="pos">{money(atDeathV(amt))}</span> at {proj.deathAge}
                </div>
              )}
            </div>
          );
        })}
        <R label="To spend"><span className="affix fig">{money(spentB)}</span></R>
        <R label="To investment"><span className="affix fig br">{money(invested)}</span></R>
        <R label="Unallocated" hint={leftOver < -0.5 ? "More allocated than you have" : null}>
          <span className={"affix fig " + (leftOver < -0.5 ? "neg" : Math.abs(leftOver) < 1 ? "pos" : "")}>{money(leftOver)}</span></R>
      </Group>
    </>
  );
}

const SCOL = ["#3D6AA6", "#6B5AA6", "#B04A40"];

function OutlookTab({ proj, state, real, compare, levers, view, setView }) {
  const a = state.assumptions;
  const adj = (v) => v;
  const acts = state.actuals || {};

  const data = proj.rows.map((r) => {
    const o = { year: r.year, age: r.age, portfolio: Math.round(adj(r.eoy)) };
    const act = acts[r.year];
    if (act && act.portfolio !== "" && act.portfolio != null)
      o.actual = Math.round(n(act.portfolio));
    o.spend = Math.round(adj(r.spend + r.oneOff));
    o.ss = Math.round(adj(r.ss));
    o.draw = Math.round(adj(r.grossDraw));
    compare.forEach((c, ci) => {
      const cr = c.proj.rows.find((x) => x.year === r.year);
      if (cr) o["s" + ci] = Math.round(cr.eoy);
    });
    return o;
  });
  const hasAct = data.some((d) => d.actual != null);

  const axis = { fill: "#A9AFB9", fontSize: 11 };
  const tip = {
    contentStyle: { background: "#fff", border: "1px solid #CFC9BC", borderRadius: 9, fontSize: 12, boxShadow: "0 4px 14px rgba(0,0,0,.07)" },
    labelStyle: { color: "#5C6472" },
  };

  return (
    <>
      <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 0 4px" }}>
        <div className="seg">
          <button className={view === "balance" ? "on" : ""} onClick={() => setView("balance")}>Balance</button>
          <button className={view === "flows" ? "on" : ""} onClick={() => setView("flows")}>Flows</button>
        </div>
        <span className="note">
          {view === "balance" ? "What the portfolio is worth each year" : "What goes out and what Social Security covers"}
        </span>
      </div>

      {!RC && <div className="note" style={{ padding: "10px 0" }}>
        The charting library didn't load, so the graphs are hidden. Every number on the other tabs still works.
      </div>}
      <div style={{ height: RC ? 300 : 0 }}>
        <ResponsiveContainer width="100%" height="100%">
          <ComposedChart data={data} margin={{ top: 8, right: 8, left: 0, bottom: 0 }}>
            <defs>
              <linearGradient id="pf" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor="#9A7526" stopOpacity={0.22} />
                <stop offset="100%" stopColor="#9A7526" stopOpacity={0.02} />
              </linearGradient>
            </defs>
            <CartesianGrid stroke="#EBE7DE" vertical={false} />
            <XAxis dataKey="age" tick={axis} stroke="#E4E0D7" tickLine={false} minTickGap={28} />
            <YAxis tickFormatter={moneyShort} tick={axis} stroke="#E4E0D7" tickLine={false} width={56} />
            <Tooltip {...tip} labelFormatter={(v, pl) => `Age ${v}${pl && pl[0] ? ` · ${pl[0].payload.year}` : ""}`}
              formatter={(v, nm) => [money(v), nm]} />
            <ReferenceLine x={proj.retAge} stroke="#9A7526" strokeDasharray="3 4"
              label={{ value: "retire", fill: "#9A7526", fontSize: 10, position: "insideTopLeft" }} />
            {proj.depletionAge && <ReferenceLine x={proj.depletionAge} stroke="#B04A40" strokeDasharray="3 4"
              label={{ value: "empty", fill: "#B04A40", fontSize: 10, position: "insideTopRight" }} />}

            {view === "balance" && <Area type="monotone" dataKey="portfolio" name="Portfolio"
              stroke="#9A7526" strokeWidth={2.2} fill="url(#pf)" dot={false} />}
            {view === "balance" && compare.map((c, ci) => (
              <Line key={c.id} type="monotone" dataKey={"s" + ci} name={c.name}
                stroke={SCOL[ci % 3]} strokeWidth={1.5} strokeDasharray="5 3" dot={false} />
            ))}
            {view === "balance" && hasAct && <Line type="monotone" dataKey="actual" name="Actual"
              stroke="#1E7A5A" strokeWidth={2.4} dot={{ r: 3, fill: "#1E7A5A" }} connectNulls />}

            {view === "flows" && <Area type="monotone" dataKey="spend" name="Spending"
              stroke="#B04A40" strokeWidth={2} fill="#FBEDEB" dot={false} />}
            {view === "flows" && <Line type="monotone" dataKey="draw" name="From the portfolio"
              stroke="#9A7526" strokeWidth={2} dot={false} />}
            {view === "flows" && <Line type="monotone" dataKey="ss" name="Social Security"
              stroke="#1E7A5A" strokeWidth={2} dot={false} />}
            {(view === "flows" || compare.length > 0 || hasAct) &&
              <Legend wrapperStyle={{ fontSize: 11, color: "#5C6472" }} iconType="plainline" iconSize={14} />}
          </ComposedChart>
        </ResponsiveContainer>
      </div>

      <div className="note" style={{ margin: "4px 0 14px" }}>
        Dollars of the year shown. The Year by year tab restates the balance in {n(state.assumptions.baseYear, CY)} money.
        {view === "balance" && proj.breakEvenAge && ` · the line turns back up at ${proj.breakEvenAge}, once Social Security carries part of the spending`}
      </div>

      <H>To reach your legacy goal</H>
      <div className="cards">
        <div className="card">
          <div className="k">Save each year</div>
          <div className="v fig">{levers.contribution == null ? "Out of reach" : money(levers.contribution)}</div>
          <div className="note" style={{ marginTop: 3 }}>
            {levers.contribution == null ? "No saving level gets there. Move retirement later or spend less."
              : levers.contribution > n(a.annualContribution)
                ? `${money(levers.contribution - n(a.annualContribution))} more than you're planning`
                : `${money(n(a.annualContribution) - levers.contribution)} of room against your plan`}
          </div>
        </div>
        <div className="card">
          <div className="k">Or retire at</div>
          <div className="v fig">{levers.retAge == null ? "Not reachable" : levers.retAge}</div>
          <div className="note" style={{ marginTop: 3 }}>
            {levers.retAge == null ? "Working to the end doesn't close it at this spending."
              : levers.retAge > n(a.retirementAge) ? `${levers.retAge - n(a.retirementAge)} years later than planned`
                : `${n(a.retirementAge) - levers.retAge} years earlier than planned`}
          </div>
        </div>
        <div className="card">
          <div className="k">Or earn</div>
          <div className="v fig">{levers.ret == null ? "Above 20%" : pct(levers.ret)}</div>
          <div className="note" style={{ marginTop: 3 }}>
            {levers.ret == null ? "Implausible. The gap has to close elsewhere."
              : `Before retirement, against the ${pct(n(a.preReturn))} you've assumed`}
          </div>
        </div>
      </div>
    </>
  );
}

function YearsTab({ proj, real, a, setA }) {
  const [all, setAll] = useState(false);
  const adj = (v) => v;
  const g = proj.spendIsGross;
  const c = (v) => (v ? moneyShort(v) : "—");
  const bY = n(a.baseYear, CY);
  const infl = n(a.inflation);
  const buying = (r) => r.eoy / Math.pow(1 + infl, r.year - bY);
  return (
    <>
      <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 0", flexWrap: "wrap" }}>
        <div className="seg">
          <button className={!all ? "on" : ""} onClick={() => setAll(false)}>Essentials</button>
          <button className={all ? "on" : ""} onClick={() => setAll(true)}>Every column</button>
        </div>
        <span className="note">Buying power in</span>
        <YearNum value={a.baseYear} w="sm" onChange={(v) => setA({ baseYear: v })} />
        <span className="note">dollars</span>
      </div>
      <div className="note" style={{ paddingBottom: 8 }}>
        {g ? "Withdrawal is what's left after Social Security — nothing is added for tax, since your budgets carry it."
           : "Withdrawal is grossed up for tax on top of the net need."}
        {" "}The last column restates each year's ending balance in {bY} money, so you can see what it would actually buy.
      </div>
      <div className="scr">
        <table className="t">
          <thead>
            <tr>
              <th>Year</th><th>Age</th><th>Start</th><th>Added</th>
              {all && <><th>Vesting</th><th>Growth</th></>}
              <th>Spend</th>
              {all && <><th>One-off</th></>}
              <th>Soc. Sec.</th>
              {all && <><th>Net need</th>{!g && <th>Tax</th>}</>}
              <th>Withdrawn</th><th>End</th>
              {all && <th>Home</th>}
              <th>Buying power</th>
            </tr>
          </thead>
          <tbody>
            {proj.rows.map((r) => (
              <tr key={r.year} className={r.shortfall > 0 ? "bad" : r.age === proj.retAge ? "mk" : ""}>
                <td>{r.year}</td><td>{r.age}</td>
                <td>{c(adj(r.boy))}</td>
                <td>{c(adj(r.inflows))}</td>
                {all && <><td className="mut">{c(adj(r.vestGross))}</td><td>{c(adj(r.growth))}</td></>}
                <td>{c(adj(r.spend))}</td>
                {all && <td>{c(adj(r.oneOff))}</td>}
                <td className={r.ssNet ? "pos" : ""}>{r.ssNet ? "\u2212" + moneyShort(adj(r.ssNet)) : "—"}</td>
                {all && <><td>{c(adj(r.netNeed))}</td>{!g && <td>{c(adj(r.taxDrag))}</td>}</>}
                <td className={r.grossDraw ? "neg" : ""}>{c(adj(r.grossDraw))}</td>
                <td className="fig">{c(adj(r.eoy))}</td>
                {all && <td className="mut">{c(adj(r.homeEq))}</td>}
                <td className="fig br">{c(buying(r))}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </>
  );
}

const ANCHOR_LABEL = { "-3": "Crash 3 years before you retire", "0": "Crash the year you retire", "3": "Crash 3 years after you retire" };

function StressTab({ result, cfg, setCfg, proj }) {
  if (!result) return <div className="empty">Working…</div>;
  const { runs, startYears, retAge, deathAge, age0, infl } = result;
  const sums = [-3, 0, 3].map((x) => ({ anchor: x, s: summarize(runs, x) })).filter((x) => x.s);
  const view = n(cfg.anchorView, 0);
  const ages = proj.rows.map((r) => r.age);
  const fan = fanData(runs, view, ages, infl, age0);
  const planLine = proj.rows.map((r) => Math.round(r.eoy));
  const merged = fan.map((f, i) => ({ ...f, plan: planLine[i] }));
  const viewRuns = runs.filter((r) => r.anchor === view).slice()
    .sort((x, y) => (x.depletionAge ?? 999) - (y.depletionAge ?? 999) || x.terminal - y.terminal);
  const axis = { fill: "#A9AFB9", fontSize: 11 };

  return (
    <>
      <div className="cards" style={{ marginTop: 12 }}>
        {sums.map(({ anchor, s }) => (
          <button key={anchor} onClick={() => setCfg({ anchorView: anchor })}
            className="card" style={{
              textAlign: "left", cursor: "pointer",
              borderColor: anchor === view ? "#9A7526" : undefined,
              background: anchor === view ? "#FDFBF6" : undefined,
            }}>
            <div className="k">{ANCHOR_LABEL[String(anchor)]}</div>
            <div className="v fig">
              <span className={s.rate >= 0.9 ? "pos" : s.rate >= 0.7 ? "br" : "neg"}>{pct(s.rate, 0)}</span>
              <span className="note"> lasted</span>
            </div>
            <div className="note" style={{ marginTop: 3 }}>
              {s.earliestDep ? <>Dry between {s.earliestDep} and {s.latestDep}</> : "None ran dry"}
              {" · "}median {moneyShort(s.p50)} left
            </div>
            <div className="note">Worst {s.worst.startYear} — {s.worst.era}</div>
          </button>
        ))}
      </div>

      <div style={{ display: "flex", alignItems: "center", gap: 10, margin: "18px 0 2px", flexWrap: "wrap" }}>
        <span className="hdr" style={{ padding: 0 }}>Charting</span>
        <div className="seg">
          {[-3, 0, 3].map((x) => (
            <button key={x} className={view === x ? "on" : ""} onClick={() => setCfg({ anchorView: x })}>
              {x === 0 ? "At retirement" : x < 0 ? "3 yrs before" : "3 yrs after"}
            </button>
          ))}
        </div>
        <span className="note">{ANCHOR_LABEL[String(view)]}</span>
      </div>
      <div style={{ height: 270 }}>
        <ResponsiveContainer width="100%" height="100%">
          <ComposedChart data={merged} margin={{ top: 8, right: 8, left: 0, bottom: 0 }}>
            <CartesianGrid stroke="#EBE7DE" vertical={false} />
            <XAxis dataKey="age" tick={axis} stroke="#E4E0D7" tickLine={false} minTickGap={28} />
            <YAxis tickFormatter={moneyShort} tick={axis} stroke="#E4E0D7" tickLine={false} width={56} />
            <Tooltip contentStyle={{ background: "#fff", border: "1px solid #CFC9BC", borderRadius: 9, fontSize: 12 }}
              labelFormatter={(v) => `Age ${v}`}
              formatter={(v, nm) => [Array.isArray(v) ? `${money(v[0])} to ${money(v[1])}` : money(v), nm]} />
            <Legend wrapperStyle={{ fontSize: 11, color: "#5C6472" }} iconType="plainline" iconSize={14} />
            <ReferenceLine x={retAge} stroke="#9A7526" strokeDasharray="3 4" />
            <Area dataKey="band" name="Middle 80% of history" stroke="none" fill="#3D6AA6" fillOpacity={0.13} />
            <Line type="monotone" dataKey="worst" name="Worst sequence" stroke="#B04A40" strokeWidth={1.5} dot={false} />
            <Line type="monotone" dataKey="median" name="Median" stroke="#1E7A5A" strokeWidth={2.2} dot={false} />
            <Line type="monotone" dataKey="plan" name="Your smooth plan" stroke="#9A7526" strokeWidth={2} strokeDasharray="5 3" dot={false} />
          </ComposedChart>
        </ResponsiveContainer>
      </div>

      <H>Glidepath</H>
      <div className="note" style={{ paddingBottom: 6 }}>
        Conventional practice holds a high equity share until roughly ten years out, cuts to about 60% by
        retirement, and drifts to a floor near 35% in later life. Going much below 30% is generally treated as
        counterproductive — it trades market risk for the risk of outliving the money.
      </div>
      <R label="Equity share to start" hint={`Held until the first step-down`}>
        <Pctf value={cfg.equityShare} onChange={(v) => setCfg({ equityShare: v })} /></R>
      {(cfg.steps || []).map((g, i) => (
        <R key={g.id} label={`Step ${i + 1} — from age`}
          hint={g.age === "" || g.age == null ? "Leave the age blank to skip this step"
            : `${pct(equityAt(n(g.age), cfg))} equity from ${n(g.age)}, about ${pct(equityAt(n(g.age), cfg) * 0.0681 + (1 - equityAt(n(g.age), cfg)) * n(cfg.otherReal, 0.02))} real`}>
          <span style={{ display: "inline-flex", gap: 6 }}>
            <Num value={g.age} w="xs"
              onChange={(v) => setCfg({ steps: cfg.steps.map((x, j) => j === i ? { ...x, age: v } : x) })} />
            <Pctf value={g.pct}
              onChange={(v) => setCfg({ steps: cfg.steps.map((x, j) => j === i ? { ...x, pct: v } : x) })} />
          </span>
        </R>
      ))}
      <R label="What the non-equity sleeve earns" hint="Real, after inflation. Long-run bonds and cash sit near 2%.">
        <Pctf value={cfg.otherReal} onChange={(v) => setCfg({ otherReal: v })} /></R>
      <div className="note" style={{ padding: "8px 0 2px" }}>
        Equity at retirement is {pct(equityAt(proj.retAge, cfg))}, and {pct(equityAt(proj.deathAge, cfg))} at{" "}
        {proj.deathAge}. The glidepath applies to this stress test only — the main projection still uses the flat
        returns you entered, so a falling equity share here will not move the headline figures.
      </div>

      <div style={{ display: "flex", gap: 12, flexWrap: "wrap", margin: "12px 0 6px", alignItems: "center" }}>
        <div className="seg">
          <button className={cfg.mode === "real" ? "on" : ""} onClick={() => setCfg({ mode: "real" })}>Inflation-matched</button>
          <button className={cfg.mode === "nominal" ? "on" : ""} onClick={() => setCfg({ mode: "nominal" })}>Raw nominal</button>
        </div>
        <div className="seg">
          <button className={cfg.window === "last70" ? "on" : ""} onClick={() => setCfg({ window: "last70" })}>Last 70</button>
          <button className={cfg.window === "complete" ? "on" : ""} onClick={() => setCfg({ window: "complete" })}>Complete only</button>
        </div>
      </div>

      <div className="scr" style={{ maxHeight: "38vh" }}>
        <table className="t">
          <thead><tr><th>Starts</th><th>Era</th><th>Runs dry</th><th>Portfolio at {deathAge}</th></tr></thead>
          <tbody>
            {viewRuns.map((r) => (
              <tr key={r.startYear + ":" + r.anchor} className={r.depletionAge ? "bad" : ""}>
                <td>{r.startYear}{r.wrapped && <span className="mut"> wrapped</span>}</td>
                <td className="mut" style={{ textAlign: "right" }}>{r.era}</td>
                <td className={r.depletionAge ? "neg" : "pos"}>{r.depletionAge ? `age ${r.depletionAge}` : "never"}</td>
                <td className="fig">{moneyShort(r.terminal)}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div className="note" style={{ marginTop: 10 }}>
        {startYears.length} starting years × 3 timings, each replaying {SEQ_LEN} years of real S&amp;P 500 returns.
        This is history, not probability — ninety-eight years holds about three independent thirty-year sequences, so
        a 90% survival rate is not a 90% chance.
      </div>
    </>
  );
}

/* ============================================================
   Tracking — actuals and scenarios
   ============================================================ */

function flatten(obj, prefix = "", out = {}) {
  Object.entries(obj || {}).forEach(([k, v]) => {
    const key = prefix ? prefix + "." + k : k;
    if (Array.isArray(v)) out[key] = JSON.stringify(v.map((x) => (x && x.id ? { ...x, id: undefined } : x)));
    else if (v && typeof v === "object") flatten(v, key, out);
    else out[key] = v;
  });
  return out;
}
const prettyKey = (k) => k.split(".").pop().replace(/([A-Z])/g, " $1").replace(/^./, (c) => c.toUpperCase());
function diffInputs(A, B) {
  const fa = flatten(A), fb = flatten(B);
  const out = [];
  new Set([...Object.keys(fa), ...Object.keys(fb)]).forEach((k) => {
    if (String(fa[k] ?? "") !== String(fb[k] ?? "")) out.push({ key: k, from: fa[k], to: fb[k] });
  });
  return out;
}
function fmtVal(v) {
  if (v === "" || v == null) return "blank";
  if (typeof v === "string" && v.startsWith("[")) return "list changed";
  const num = Number(v);
  if (!isFinite(num)) return String(v);
  if (Math.abs(num) > 0 && Math.abs(num) < 1) return pct(num);
  if (Math.abs(num) >= 1000) return money(num);
  return String(num);
}

function TrackingTab({ state, setState, proj, baselineProj, compareIds, setCompareIds, open, toggle }) {
  const [name, setName] = useState("");
  const scenarios = state.scenarios || [];
  const baseline = scenarios.find((s) => s.isBaseline);
  const base = baselineProj || proj;

  const rows = [];
  const trackTo = CY + Math.max(0, 67 - n(state.profile.currentAge, 40));
  for (let y = CY - 8; y <= trackTo; y++) {
    rows.push({ year: y, planRow: base.rows.find((r) => r.year === y), act: (state.actuals || {})[y] || {} });
  }
  const setAct = (year, patch) =>
    setState((s) => ({ ...s, actuals: { ...s.actuals, [year]: { ...(s.actuals || {})[year], ...patch } } }));

  const recorded = rows.filter((r) => r.act.portfolio !== "" && r.act.portfolio != null && r.planRow);
  const latest = recorded[recorded.length - 1];
  const gap = latest ? n(latest.act.portfolio) - latest.planRow.eoy : null;

  const snapshot = () => ({
    profile: JSON.parse(JSON.stringify(state.profile)),
    assumptions: JSON.parse(JSON.stringify(state.assumptions)),
  });
  const metricsOf = (snap) => {
    const pr = project(snap.profile, snap.assumptions);
    return { atRetirement: pr.portfolioAtRetirement, terminal: pr.terminalEstate, gap: pr.legacyGap,
      depleted: pr.depletionAge, retAge: pr.retAge };
  };
  const save = () => {
    const snap = snapshot();
    setState((st) => ({ ...st, scenarios: [...(st.scenarios || []), {
      id: uid(), name: name.trim() || `Scenario ${scenarios.length + 1}`, createdAt: new Date().toISOString(),
      isBaseline: scenarios.length === 0, ...snap, metrics: metricsOf(snap) }] }));
    setName("");
  };
  const load = (s) => setState((st) => ({ ...st,
    profile: JSON.parse(JSON.stringify(s.profile)), assumptions: JSON.parse(JSON.stringify(s.assumptions)) }));
  const promote = (s) => {
    const prior = scenarios.find((x) => x.isBaseline);
    const changes = prior ? diffInputs({ profile: prior.profile, assumptions: prior.assumptions },
      { profile: s.profile, assumptions: s.assumptions }) : [];
    setState((st) => ({ ...st,
      scenarios: st.scenarios.map((x) => ({ ...x, isBaseline: x.id === s.id })),
      ledger: [...(st.ledger || []), { id: uid(), at: new Date().toISOString(), name: s.name,
        from: prior ? prior.name : null, metrics: s.metrics || metricsOf(s), changes: changes.slice(0, 10) }] }));
  };
  const toggleCmp = (id) => setCompareIds((ids) =>
    ids.includes(id) ? ids.filter((x) => x !== id) : ids.length >= 3 ? ids : [...ids, id]);
  const drift = baseline ? diffInputs({ profile: baseline.profile, assumptions: baseline.assumptions },
    { profile: state.profile, assumptions: state.assumptions }) : [];

  return (
    <>
      <H>Where you actually are</H>
      <div className="card" style={{ marginTop: 4 }}>
        <div className="k">Latest check-in vs {baselineProj ? "your plan of record" : "the plan you're editing"}</div>
        <div className="v fig">{latest ? money(n(latest.act.portfolio)) : "—"}</div>
        <div className={"note " + (gap == null ? "" : gap >= 0 ? "pos" : "neg")} style={{ marginTop: 2 }}>
          {gap == null ? "Enter a balance below to start tracking."
            : `${gap >= 0 ? "Ahead by" : "Behind by"} ${money(Math.abs(gap))} at end of ${latest.year}`}
          {!baselineProj && " · save a scenario as your plan of record to freeze the target"}
        </div>
      </div>

      <div className="scr" style={{ maxHeight: "34vh", marginTop: 12 }}>
        <table className="t">
          <thead><tr><th>Year</th><th>Plan</th><th>Actual</th><th>Variance</th><th>Note</th></tr></thead>
          <tbody>
            {rows.map(({ year, planRow, act }) => {
              const plan = planRow ? planRow.eoy : null;
              const actual = act.portfolio === "" || act.portfolio == null ? null : n(act.portfolio);
              const v = plan != null && actual != null ? actual - plan : null;
              return (
                <tr key={year} className={year === CY ? "mk" : ""}>
                  <td>{year}{year === CY && <span className="mut"> now</span>}</td>
                  <td className="fig">{plan != null ? moneyShort(plan) : "—"}</td>
                  <td><Num value={act.portfolio ?? ""} prefix="$" w="sm" onChange={(val) => setAct(year, { portfolio: val })} /></td>
                  <td className={v == null ? "" : v >= 0 ? "pos" : "neg"}>
                    {v == null ? "—" : (v >= 0 ? "+" : "\u2212") + moneyShort(Math.abs(v))}</td>
                  <td style={{ textAlign: "left" }}>
                    <Txt style={{ minWidth: 130 }} placeholder="What happened"
                      value={act.note ?? ""} onChange={(t) => setAct(year, { note: t })} /></td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      <div style={{ height: 14 }} />

      <Group id="scen" title="Scenarios" open={open.scen} toggle={toggle}
        summary={scenarios.length ? `${scenarios.length} saved` : "none yet"}
        lead="What you're editing is a sandbox. Saving freezes a copy; one becomes your plan of record, and your actuals are measured against it.">
        <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
          <input className="inp txt" placeholder="Name this version" value={name} onChange={(e) => setName(e.target.value)} />
          <button className="btn pri" onClick={save}>Save</button>
        </div>
        {baseline && drift.length > 0 && (
          <div className="note" style={{ marginBottom: 8 }}>
            {drift.length} change{drift.length > 1 ? "s" : ""} from “{baseline.name}”:{" "}
            {drift.slice(0, 4).map((d) => `${prettyKey(d.key)} ${fmtVal(d.from)}→${fmtVal(d.to)}`).join(" · ")}
            {drift.length > 4 && ` and ${drift.length - 4} more`}
          </div>
        )}
        {scenarios.length === 0 ? (
          <div className="empty">Set your assumptions the way you expect things to go, then save it as your plan of record.</div>
        ) : (
          <div className="scr" style={{ maxHeight: "30vh" }}>
            <table className="t">
              <thead><tr><th>Scenario</th><th>Retire</th><th>Estate</th><th>vs goal</th><th>Dry</th><th></th></tr></thead>
              <tbody>
                {scenarios.map((s) => {
                  const m = s.metrics || metricsOf(s);
                  return (
                    <tr key={s.id}>
                      <td>
                        <label className="chk">
                          <input type="checkbox" checked={compareIds.includes(s.id)} onChange={() => toggleCmp(s.id)} />
                          <span>{s.name} {s.isBaseline && <span className="pill on">plan of record</span>}</span>
                        </label>
                      </td>
                      <td>{m.retAge}</td>
                      <td className="fig">{moneyShort(m.terminal)}</td>
                      <td className={m.gap >= 0 ? "pos" : "neg"}>
                        {(m.gap >= 0 ? "+" : "\u2212") + moneyShort(Math.abs(m.gap))}</td>
                      <td className={m.depleted ? "neg" : "pos"}>{m.depleted || "never"}</td>
                      <td style={{ whiteSpace: "nowrap" }}>
                        <button className="btn gh sm" onClick={() => load(s)}>Open</button>{" "}
                        {!s.isBaseline && <button className="btn gh sm" onClick={() => promote(s)}>Make plan</button>}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
        {compareIds.length > 0 && (
          <div className="note" style={{ marginTop: 8 }}>
            {compareIds.map((id, i) => {
              const s = scenarios.find((x) => x.id === id);
              return s ? <span key={id} style={{ marginRight: 12 }}>
                <span className="dot" style={{ background: SCOL[i % 3] }} /> {s.name}</span> : null;
            })} drawn on the Outlook chart.
          </div>
        )}
      </Group>

      <Group id="ledger" title="How the plan has changed" open={open.ledger} toggle={toggle}
        summary={(state.ledger || []).length ? `${state.ledger.length} entries` : "no history"}>
        {(state.ledger || []).length === 0 ? (
          <div className="empty">Each time you adopt a new plan of record, what changed and what it did lands here.</div>
        ) : [...state.ledger].reverse().map((e) => (
          <div className="card" key={e.id} style={{ marginTop: 8 }}>
            <div style={{ display: "flex", gap: 8, alignItems: "baseline" }}>
              <strong>{e.name}</strong>
              {e.from && <span className="note">replaced “{e.from}”</span>}
              <span className="note" style={{ marginLeft: "auto" }}>{new Date(e.at).toLocaleDateString()}</span>
            </div>
            <div className="note" style={{ marginTop: 4 }}>
              Retire {e.metrics.retAge} · estate {moneyShort(e.metrics.terminal)} ·{" "}
              <span className={e.metrics.gap >= 0 ? "pos" : "neg"}>
                {e.metrics.gap >= 0 ? "clears" : "misses"} the goal by {moneyShort(Math.abs(e.metrics.gap))}</span>
            </div>
            {e.changes && e.changes.length > 0 && (
              <div className="note" style={{ marginTop: 4 }}>
                {e.changes.map((c) => `${prettyKey(c.key)} ${fmtVal(c.from)}→${fmtVal(c.to)}`).join(" · ")}
              </div>
            )}
          </div>
        ))}
      </Group>

      <Group id="method" title="What the model assumes" open={open.method} toggle={toggle}
        summary="tax, Social Security, what's excluded">
        <MethodBody state={state} proj={proj} />
      </Group>
    </>
  );
}
