  const x = typeof v === "number" ? v : parseFloat(String(v ?? "").replace(/[^0-9.\-]/g, ""));

  if (v == null || !isFinite(v)) return "—";
  const s = v < 0 ? "\u2212" : "";

};
const moneyShort = (v) => {
  if (v == null || !isFinite(v)) return "—";
  const a = Math.abs(v), s = v < 0 ? "\u2212" : "";
  if (a >= 1e9) return s + "$" + (a / 1e9).toFixed(2) + "B";
  if (a >= 1e6) return s + "$" + (a / 1e6).toFixed(a >= 1e7 ? 1 : 2) + "M";
  if (a >= 1e3) return s + "$" + Math.round(a / 1e3) + "k";
  return s + "$" + Math.round(a);
};

const DEFAULT_ACTUALS = {};

const DEFAULT_STATE = {
  version: 1,
  profile: DEFAULT_PROFILE,
  assumptions: DEFAULT_ASSUMPTIONS,
  actuals: DEFAULT_ACTUALS,
  scenarios: [],
  ledger: [],
  annual: { year: CY, sheets: {} },
  whatif: { a: { k: "", v: null }, b: { k: "", v: null } },

/* ============================================================
   Social Security estimate
   ============================================================ */

function computeSS(profile, a) {
  const max = n(a.taxableMax, SS_DEFAULTS.taxableMax) || SS_DEFAULTS.taxableMax;
  const first = n(a.ssFirstYear, CY - 20);
  const age0 = n(profile.currentAge, 40);
  const retAge = n(a.retirementAge, 65);

  // Every year of earnings is assumed to reach the taxable maximum, past and future.
  const pastYears = Math.max(0, CY - first);
  const futureYears = Math.max(0, retAge - age0);
  const totalYears = pastYears + futureYears;
  const credited = Math.min(35, totalYears);

  const aime = (credited * max) / 420;

  const b1 = SS_DEFAULTS.bend1, b2 = SS_DEFAULTS.bend2;
  const pia =
    0.9 * Math.min(aime, b1) +
    0.32 * Math.max(0, Math.min(aime, b2) - b1) +
    0.15 * Math.max(0, aime - b2);

  const fra = n(a.fra, 67);
  const claimAge = a.waitForFRA ? fra : clamp(n(a.claimAge, 62), 62, 70);
  const months = Math.round((claimAge - fra) * 12);
  let factor = 1;
  if (months < 0) {
    const early = -months;
    const first36 = Math.min(early, 36);
    const rest = Math.max(0, early - 36);
    factor = 1 - (first36 * 5) / 900 - (rest * 5) / 1200;
  } else if (months > 0) {
    factor = 1 + Math.min(months, 36) * (2 / 300);
  }

  return {
    aime,
    piaMonthly: pia,
    claimAge,
    factor,
    monthlyAtClaim: pia * factor,
    annualAtClaim: pia * factor * 12,
    yearsCredited: totalYears,
    creditedUsed: credited,
    pastYears, futureYears,
  };
}

/* ============================================================
   Balance sheet
   ============================================================ */

function balanceSheet(p) {
  const retirementAccts = n(p.roth) + n(p.ira) + n(p.k401);
  const taxable = n(p.funds) + n(p.vestedEquity) + n(p.vestedCarry);
  const usableCash = Math.max(0, n(p.cash) - n(p.cashReserve));
  const investable = retirementAccts + taxable + usableCash;
  const homeEquity = n(p.homeValue) - n(p.mortgageBalance);
  const netWorth = investable + n(p.cashReserve) + homeEquity + n(p.fiveTwoNine);
  return { retirementAccts, taxable, usableCash, investable, homeEquity, netWorth };
}

/* ---------- mortgage amortisation ----------
   Annual schedule. Extra payments are applied to principal at the start of the year,
   before interest accrues. Returns one entry per year from startYear. */
function amortize(balance, rate, annualPay, extrasByYear, startYear, years) {
  const sched = [];
  let bal = Math.max(0, balance);
  let totalInterest = 0;
  let payoffOffset = null;
  for (let i = 0; i < years; i++) {
    const year = startYear + i;
    const open = bal;
    const extra = bal > 0 ? Math.min(bal, extrasByYear[year] || 0) : 0;
    bal -= extra;
    let interest = 0, principal = 0;
    if (bal > 0) {
      interest = bal * rate;
      const due = bal + interest;
      const pay = Math.min(annualPay, due);
      principal = Math.max(0, pay - interest);
      bal = Math.max(0, bal - principal);
      totalInterest += interest;
    }
    if (bal <= 0 && payoffOffset === null && open > 0) payoffOffset = i;
    sched.push({ year, open, extra, interest, principal, balance: bal });
  }
  return { sched, totalInterest, payoffOffset, neverPaysOff: bal > 0 };
}

function extrasByYear(list, dest) {
  const m = {};
  (list || []).forEach((e) => {
    if (e.dest !== dest) return;
    const y = n(e.year, 0);
    if (!y) return;
    m[y] = (m[y] || 0) + n(e.amount);
  });
  return m;
}

/* ============================================================
   Projection engine
   ============================================================ */

function project(profile, a, opts = {}) {
  const seq = opts.returns || null;
  const bs = balanceSheet(profile);
  const age0 = n(profile.currentAge, 40);
  const deathAge = Math.max(age0 + 1, n(a.deathAge, 92));
  const retAge = clamp(n(a.retirementAge, 65), age0, deathAge);
  const infl = n(a.inflation, 0.025);
  const preR = n(a.preReturn, 0.07);
  const postR = n(a.postReturn, 0.05);
  const tax = clamp(n(a.effectiveTaxRate, 0), 0, 0.6);
  const ss = computeSS(profile, a);

  let portfolio = a.assetsOverride !== "" && a.assetsOverride != null
    ? n(a.assetsOverride) : bs.investable;

  let homeSold = false;
  const ssTaxable = clamp(n(a.ssTaxablePortion, 0.85), 0, 1);
  const spendIsGross = a.spendBasis !== "net";
  const vestShare = clamp(n(a.vestingToPortfolio, 0), 0, 1);

  /* Mortgage runs on its own schedule, with and without your extra payments,
     so the comparison between the two is available. */
  const years = deathAge - age0 + 1;
  const mortRate = n(profile.mortgageRate, 0);
  const mortPay = n(profile.mortgagePayment, 0) * 12;
  const mortStart = n(profile.mortgageBalance, 0);
  const withExtraMap = extrasByYear(a.extras, "mortgage");
  const mortgageInSpend = a.mortgageInSpend === "added";

  const withExtra = amortize(mortStart, mortRate, mortPay, withExtraMap, CY, years);
  const noExtra = amortize(mortStart, mortRate, mortPay, {}, CY, years);
  let homeVal = (a.homeEquityOverride !== "" && a.homeEquityOverride != null)
    ? n(a.homeEquityOverride) + mortStart
    : n(profile.homeValue, 0);
  const portfolioExtras = extrasByYear(a.extras, "portfolio");
  const rows = [];
  let depletionAge = null, peak = 0, cumSS = 0, cumSSNet = 0, cumDraw = 0,
    cumDrawNoSS = 0, cumContrib = 0, cumShort = 0, cumNeed = 0, cumCovered = 0;

  for (let age = age0; age <= deathAge; age++) {
    const t = age - age0;
    const year = CY + t;
    const inf = Math.pow(1 + infl, t);
    const retired = age >= retAge;
    const r = seq && seq[age] != null ? seq[age] : (retired ? postR : preR);
    const boy = portfolio;
    const mort = withExtra.sched[t] || { balance: 0, interest: 0, extra: 0 };

    let contrib = 0;
    if (!retired) contrib = n(a.annualContribution) * Math.pow(1 + n(a.contributionGrowth), t);

    let vestGross = 0;
    (profile.vesting || []).forEach((v) => {
      if (n(v.year, -1) === year) vestGross += n(v.amount) * (n(v.prob, 100) / 100);
    });
    const vest = vestGross * vestShare;          // nothing lands unless you direct it
    const extraIn = portfolioExtras[year] || 0;  // one-off additions from the What if tab

    let homeProceeds = 0;
    if (!homeSold && a.sellHomeAge !== "" && a.sellHomeAge != null && age === n(a.sellHomeAge)) {
      homeProceeds = Math.max(0, homeVal - mort.balance) * clamp(n(a.homeReleasePct, 0.85), 0, 1);
      homeSold = true;
    }

    const inflows = contrib + vest + extraIn + homeProceeds;

    let spend = 0, mortSpend = 0;
    if (retired) {
      const yi = age - retAge;
      const yearsA = n(a.budgetA.years, 0);
      const base = yi < yearsA ? n(a.budgetA.amount) : n(a.budgetB.amount);
      spend = base * inf;
      // The payment is fixed in nominal dollars, so it never inflates — and it stops
      // dead the year the loan clears, which is the whole point of paying it down.
      if (mortgageInSpend && !homeSold) {
        mortSpend = mort.interest + mort.principal;
        spend += mortSpend;
      }
    }

    let oneOff = 0;
    (a.oneOffs || []).forEach((o) => {
      if (o.age !== "" && n(o.age, -1) === age) oneOff += n(o.amount) * inf;
    });

    /* --- Social Security, netted against what you need to spend ---
       When spending is stated gross of tax, the year's tax bill is already inside the
       spend figure, so the withdrawal is simply the shortfall and the benefit counts
       at its gross amount. When it's stated net, tax is added on top of both. */
    const ssGross = age >= ss.claimAge ? ss.annualAtClaim * inf : 0;
    const ssApplied = spendIsGross ? ssGross : ssGross * (1 - tax * ssTaxable);

    const need = spend + oneOff;                       // what the year costs you
    const coveredBySS = Math.min(need, ssApplied);     // paid for by the benefit
    const surplusSS = ssApplied - coveredBySS;         // spare benefit is reinvested
    const netNeed = Math.max(0, need - ssApplied);     // what the portfolio has to fund
    let grossDraw = netNeed > 0 ? (spendIsGross ? netNeed : netNeed / (1 - tax)) : 0;
    const drawNoSS = need > 0 ? (spendIsGross ? need : need / (1 - tax)) : 0;

    const allInflows = inflows + surplusSS;

    let shortfall = 0;
    const avail = Math.max(0, boy + allInflows);
    if (grossDraw > avail) {
      shortfall = grossDraw - avail;
      grossDraw = avail;
      if (depletionAge === null) depletionAge = age;
    }
    cumShort += shortfall;

    const net = allInflows - grossDraw;
    let eoy = boy * (1 + r) + net * Math.sqrt(Math.max(0.2, 1 + r));
    if (eoy < 0) eoy = 0;

    if (!homeSold) {
      homeVal = homeVal * (1 + n(a.homeAppreciation, 0));
      if (a.homeValueCap !== "" && a.homeValueCap != null) homeVal = Math.min(homeVal, n(a.homeValueCap));
    }
    const homeEq = homeSold ? 0 : Math.max(0, homeVal - mort.balance);

    cumSS += ssGross;
    cumSSNet += ssApplied;
    cumNeed += need;
    cumCovered += coveredBySS;
    cumDraw += grossDraw;
    cumDrawNoSS += drawNoSS;
    cumContrib += contrib;
    peak = Math.max(peak, eoy);

    rows.push({
      year, age, t, inf, retired,
      boy, contrib, vest, vestGross, extraIn, homeProceeds, surplusSS, inflows: allInflows,
      growth: eoy - boy - net,
      spend, oneOff, need,
      ss: ssGross, ssNet: ssApplied, coveredBySS, netNeed,
      taxDrag: spendIsGross ? 0 : grossDraw * tax,
      grossDraw, drawNoSS, shortfall, eoy,
      mortBalance: homeSold ? 0 : mort.balance,
      mortInterest: mort.interest,
      mortExtra: mort.extra,
      mortSpend,
      homeVal: homeSold ? 0 : homeVal,
      homeEq,
      estate: eoy + homeEq,
    });
    portfolio = eoy;
  }

  const last = rows[rows.length - 1] || {};
  const retRow = rows.find((r) => r.age === retAge);
  const goalNominal = n(a.legacyGoal) * Math.pow(1 + infl, deathAge - age0);
  const firstDrawRow = rows.find((r) => r.retired && r.grossDraw > 0);
  const withdrawalRate = firstDrawRow && firstDrawRow.boy > 0 ? firstDrawRow.grossDraw / firstDrawRow.boy : 0;
  const realPostReturn = (1 + postR) / (1 + infl) - 1;
  const realPreReturn = (1 + preR) / (1 + infl) - 1;
  const budgetAAge = retAge;
  const budgetBAge = retAge + n(a.budgetA.years, 0);
  const bRowA = rows.find((r) => r.age === budgetAAge);
  const bRowB = rows.find((r) => r.age === budgetBAge);
  const budgetARate = bRowA && bRowA.boy > 0 ? (n(a.budgetA.amount) * bRowA.inf) / bRowA.boy : null;
  const budgetBRate = bRowB && bRowB.boy > 0 ? (n(a.budgetB.amount) * bRowB.inf) / bRowB.boy : null;
  const budgetADraw = bRowA && bRowA.boy > 0 ? bRowA.grossDraw / bRowA.boy : null;
  const budgetBDraw = bRowB && bRowB.boy > 0 ? bRowB.grossDraw / bRowB.boy : null;
  const breakEvenAge = (() => {
    const r = rows.find((x) => x.retired && x.eoy > x.boy && x.grossDraw > 0);
    return r ? r.age : null;
  })();

  return {
    rows, ss, bs, depletionAge, peak,
    retAge, deathAge, age0, infl,
    startingAssets: rows[0] ? rows[0].boy : 0,
    portfolioAtRetirement: retRow ? retRow.boy : 0,
    terminalPortfolio: last.eoy || 0,
    terminalEstate: last.estate || 0,
    goalNominal,
    legacyGap: (last.estate || 0) - goalNominal,
    cumSS, cumSSNet, cumDraw, cumDrawNoSS, cumContrib, cumShort, cumNeed, cumCovered,
    ssCoverage: cumNeed > 0 ? cumCovered / cumNeed : 0,
    drawSavedBySS: cumDrawNoSS - cumDraw,
    withdrawalRate, realPostReturn, realPreReturn, breakEvenAge, spendIsGross, vestShare,
    vestScheduled: rows.reduce((s, r) => s + r.vestGross, 0),
    vestDirected: rows.reduce((s, r) => s + r.vest, 0),
    extraToPortfolio: rows.reduce((s, r) => s + r.extraIn, 0),
    extraToMortgage: rows.reduce((s, r) => s + r.mortExtra, 0),
    mortgageInSpend,
    mortRetirementYears: withExtra.payoffOffset != null
      ? Math.max(0, (age0 + withExtra.payoffOffset) - retAge) : Math.max(0, deathAge - retAge),
    mortRetirementDraw: rows.reduce((s2, r) => s2 + (r.retired ? r.mortSpend : 0), 0),
    mortPayoffAge: withExtra.payoffOffset != null ? age0 + withExtra.payoffOffset : null,
    mortPayoffAgeBase: noExtra.payoffOffset != null ? age0 + noExtra.payoffOffset : null,
    mortInterestTotal: withExtra.totalInterest,
    mortInterestBase: noExtra.totalInterest,
    interestSaved: noExtra.totalInterest - withExtra.totalInterest,
    annualMortgagePayment: mortPay,
    budgetARate, budgetBRate, budgetADraw, budgetBDraw, budgetAAge, budgetBAge,
    portfolioAtBudgetA: bRowA ? bRowA.boy : 0,
    portfolioAtBudgetB: bRowB ? bRowB.boy : 0,
  };
}

/* ============================================================
   Sequence-of-returns stress test
   ============================================================ */

function buildReturnMap(a, cfg, startIdx, anchorAge) {
  const infl = n(a.inflation, 0.025);
  const eq = clamp(n(cfg.equityShare, 0.75), 0, 1);
  const other = n(cfg.otherReal, 0.015);
  const nominalMode = cfg.mode === "nominal";
  const otherNominal = (1 + other) * (1 + infl) - 1;
  const map = {};
  for (let i = 0; i < SEQ_LEN; i++) {
    const h = HIST[(startIdx + i) % HISTN];
    const nom = h[1] / 100, cpi = h[2] / 100;
    if (nominalMode) {
      map[anchorAge + i] = eq * nom + (1 - eq) * otherNominal;
    } else {
      const realEq = (1 + nom) / (1 + cpi) - 1;
      const blendReal = eq * realEq + (1 - eq) * other;
      map[anchorAge + i] = (1 + blendReal) * (1 + infl) - 1;
    }
  }
  return map;
}

function stressTest(profile, a, cfg) {
  const infl = n(a.inflation, 0.025);
  const age0 = n(profile.currentAge, 40);
  const deathAge = Math.max(age0 + 1, n(a.deathAge, 92));
  const retAge = clamp(n(a.retirementAge, 65), age0, deathAge);
  const deflate = Math.pow(1 + infl, deathAge - age0);

  const startYears = cfg.window === "complete"
    ? HIST.filter((h) => h[0] + SEQ_LEN - 1 <= HIST[HISTN - 1][0]).map((h) => h[0])
    : HIST.slice(Math.max(0, HISTN - 70)).map((h) => h[0]);

  const runs = [];
  startYears.forEach((sy) => {
    const idx = sy - HIST0;
    const wrapped = idx + SEQ_LEN > HISTN;
    cfg.anchors.forEach((off) => {
      const anchorAge = retAge + off;
      const pr = project(profile, a, { returns: buildReturnMap(a, cfg, idx, anchorAge) });
      runs.push({
        startYear: sy, anchor: off, wrapped, era: ERA(sy),
        depletionAge: pr.depletionAge,
        terminal: pr.terminalPortfolio / deflate,
        estate: pr.terminalEstate / deflate,
        rows: pr.rows,
      });
    });
  });
  return { runs, startYears, retAge, deathAge, age0, infl };
}

function summarize(runs, anchor) {
  const set = runs.filter((r) => r.anchor === anchor);
  if (!set.length) return null;
  const survived = set.filter((r) => r.depletionAge == null);
  const failed = set.filter((r) => r.depletionAge != null);
  const ests = set.map((r) => r.terminal).sort((x, y) => x - y);
  const q = (p) => ests[clamp(Math.round(p * (ests.length - 1)), 0, ests.length - 1)];
  const deps = failed.map((r) => r.depletionAge).sort((x, y) => x - y);
  const worst = set.slice().sort((x, y) =>
    (x.depletionAge ?? 999) - (y.depletionAge ?? 999) || x.terminal - y.terminal)[0];
  const best = set.slice().sort((x, y) => y.terminal - x.terminal)[0];
  return {
    n: set.length,
    survived: survived.length,
    rate: survived.length / set.length,
    p10: q(0.1), p50: q(0.5), p90: q(0.9),
    worst, best,
    earliestDep: deps.length ? deps[0] : null,
    medianDep: deps.length ? deps[Math.floor(deps.length / 2)] : null,
    latestDep: deps.length ? deps[deps.length - 1] : null,
  };
}

function fanData(runs, anchor, ages, infl, age0) {
  const set = runs.filter((r) => r.anchor === anchor);
  return ages.map((age) => {
    const vals = [];
    set.forEach((r) => {
      const row = r.rows.find((x) => x.age === age);
      if (row) vals.push(row.eoy / Math.pow(1 + infl, age - age0));
    });
    vals.sort((x, y) => x - y);
    const q = (p) => (vals.length ? vals[clamp(Math.round(p * (vals.length - 1)), 0, vals.length - 1)] : 0);
    return {
      age,
      band: [Math.round(q(0.1)), Math.round(q(0.9))],
      median: Math.round(q(0.5)),
      worst: Math.round(q(0)),
    };
  });
}

/* ---------- solvers ---------- */
function solveContribution(profile, a) {
  const f = (c) => project(profile, { ...a, annualContribution: c }).legacyGap;
  if (f(0) >= 0) return 0;
  let lo = 0, hi = 50000;
  for (let i = 0; i < 40 && f(hi) < 0; i++) hi *= 1.6;
  if (f(hi) < 0) return null;
  for (let i = 0; i < 60; i++) {
    const mid = (lo + hi) / 2;
    if (f(mid) < 0) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}
function solveRetirementAge(profile, a) {
  const start = n(profile.currentAge, 40), end = n(a.deathAge, 92) - 1;
  for (let age = start; age <= end; age++) {
    if (project(profile, { ...a, retirementAge: age }).legacyGap >= 0) return age;
  }
  return null;
}
function solveReturn(profile, a) {
  const spread = n(a.preReturn) - n(a.postReturn);
  const f = (r) => project(profile, { ...a, preReturn: r, postReturn: Math.max(0, r - spread) }).legacyGap;
  if (f(0.20) < 0) return null;
  if (f(0) >= 0) return 0;
  let lo = 0, hi = 0.2;
  for (let i = 0; i < 60; i++) {
    const mid = (lo + hi) / 2;
    if (f(mid) < 0) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}

/* Browser storage. Everything stays on this device, in this browser profile.
   Nothing is uploaded anywhere and nothing is baked into this file. Clearing
   site data will erase it, so use the Backup button now and then. */
function loadState() {
  try {
    const v = window.localStorage.getItem(KEY);
    return { ok: true, data: v ? JSON.parse(v) : null, error: null };
  } catch (e) {
    return { ok: false, data: null, error: (e && e.message) || "Storage blocked" };
  }
}

function persist(state) {
  try {
    window.localStorage.setItem(KEY, JSON.stringify(state));
    return { ok: true, error: null };
  } catch (e) {
    return { ok: false, error: (e && e.message) || "Storage blocked" };
  }
}

/* Inputs hold a local draft while focused and only push the value up on blur or
   Enter. Escape abandons the edit. This keeps a keystroke from re-running the
   whole projection and from remounting the field underneath the cursor. */
function useDraft(value, onChange, format) {
  const [draft, setDraft] = useState(null);
  const display = draft != null ? draft : format(value);
  const commit = () => {
    if (draft == null) return;
    onChange(draft);
    setDraft(null);
  };
  const onKeyDown = (e) => {
    if (e.key === "Enter") { commit(); e.target.blur(); }
    if (e.key === "Escape") { setDraft(null); e.target.blur(); }
  };
  return { display, onChange: (e) => setDraft(e.target.value), onBlur: commit, onKeyDown };
}

function Num({ value, onChange, prefix, suffix, w = "", placeholder, disabled }) {
  const d = useDraft(value, (s) => onChange(s.trim() === "" ? "" : n(s)),
    (v) => (v === "" || v == null ? "" : Number(v).toLocaleString()));
  return (
    <span className="affix">
      {prefix && <span>{prefix}</span>}
      <input className={"inp " + w} inputMode="decimal" disabled={disabled} placeholder={placeholder}
        value={d.display} onChange={d.onChange} onBlur={d.onBlur} onKeyDown={d.onKeyDown} />
      {suffix && <span>{suffix}</span>}
    </span>
  );
}

function Pctf({ value, onChange, w = "sm" }) {
  const d = useDraft(value, (s) => onChange(s.trim() === "" ? "" : n(s) / 100),
    (v) => (v === "" || v == null ? "" : String(+(Number(v) * 100).toFixed(3))));
  return (
    <span className="affix">
      <input className={"inp " + w} inputMode="decimal"
        value={d.display} onChange={d.onChange} onBlur={d.onBlur} onKeyDown={d.onKeyDown} />
      <span>%</span>
    </span>
  );
}

function YearNum({ value, onChange, w = "xs", placeholder }) {
  const d = useDraft(value, (s) => onChange(s.trim() === "" ? "" : n(s)),

  return (
    <input className={"inp " + w} inputMode="numeric" placeholder={placeholder}
      value={d.display} onChange={d.onChange} onBlur={d.onBlur} onKeyDown={d.onKeyDown} />

}

        <R label="529 accounts" hint="Earmarked, outside the plan"><Num value={p.fiveTwoNine} onChange={(v) => setP({ fiveTwoNine: v })} prefix="$" /></R>
        <R label="Investable portfolio"><span className="affix fig br" style={{ fontSize: 15 }}>{money(bs.investable)}</span></R>
      </Group>

      <Group id="spend" title="Retirement spending" open={open.spend} toggle={toggle}
        summary={`${moneyShort(n(a.budgetA.amount))} then ${moneyShort(n(a.budgetB.amount))}`}
        lead="Today's dollars, inflated to the year they're spent. Include housing until the mortgage clears, and healthcare before Medicare at 65.">
        <R label="First phase — each year"
          hint={proj.budgetARate == null ? null : `${pct(proj.budgetARate)} of the portfolio at ${proj.budgetAAge}`}>
          <Num value={a.budgetA.amount} onChange={(v) => setA({ budgetA: { ...a.budgetA, amount: v } })} prefix="$" /></R>
        <R label="First phase — for how long" hint={`Ages ${n(a.retirementAge)}–${n(a.retirementAge) + n(a.budgetA.years) - 1}`}>
          <Num value={a.budgetA.years} onChange={(v) => setA({ budgetA: { ...a.budgetA, years: v } })} w="xs" /></R>
        <R label="Second phase — each year"
          hint={proj.budgetBRate == null ? "Starts after your plan ends" : `${pct(proj.budgetBRate)} of the portfolio at ${proj.budgetBAge}`}>
          <Num value={a.budgetB.amount} onChange={(v) => setA({ budgetB: { ...a.budgetB, amount: v } })} prefix="$" /></R>
        <R label="Second phase — for how long" hint="This rate carries on to the end either way">
          <Num value={a.budgetB.years} onChange={(v) => setA({ budgetB: { ...a.budgetB, years: v } })} w="xs" /></R>
        <R label="Plan through age"><Num value={a.deathAge} onChange={(v) => setA({ deathAge: v })} w="xs" /></R>
        <R label="Leave to heirs" hint="Today's dollars"><Num value={a.legacyGoal} onChange={(v) => setA({ legacyGoal: v })} prefix="$" /></R>
      </Group>

      <Group id="oneoff" title="One-off purchases" open={open.oneoff} toggle={toggle}
        summary={(a.oneOffs || []).filter((o) => n(o.amount) > 0).length + " planned"}
        lead="A wedding, a boat, a roof. Today's dollars, applied in the year you turn that age.">
        {(a.oneOffs || []).map((o, i) => (
          <div className="r" key={o.id}>
            <Txt placeholder={`Item ${i + 1}`} value={o.label}
              onChange={(t) => setA({ oneOffs: a.oneOffs.map((x, j) => j === i ? { ...x, label: t } : x) })} />
            <div className="vl" style={{ display: "flex", gap: 6 }}>
              <Num value={o.amount} prefix="$" w="sm"
                onChange={(v) => setA({ oneOffs: a.oneOffs.map((x, j) => j === i ? { ...x, amount: v } : x) })} />
              <Num value={o.age} prefix="age" w="xs"
                onChange={(v) => setA({ oneOffs: a.oneOffs.map((x, j) => j === i ? { ...x, age: v } : x) })} />
            </div>
          </div>
        ))}
      </Group>

      <Group id="ss" title="Social Security" open={open.ss} toggle={toggle}
        summary={`${moneyShort(proj.ss.annualAtClaim)}/yr from ${proj.ss.claimAge}`}
        lead={`Every year from your first through retirement is assumed to hit the wage cap. You have ${proj.ss.yearsCredited}; the formula counts your best 35.`}>
        <R label="Wait for full retirement age to claim">
          <div className="seg">
            <button className={a.waitForFRA ? "on" : ""} onClick={() => setA({ waitForFRA: true })}>Yes</button>
            <button className={!a.waitForFRA ? "on" : ""} onClick={() => setA({ waitForFRA: false })}>No</button>
          </div>
        </R>
        <R label="Claim at age" hint={a.waitForFRA ? "Ignored while you're waiting for FRA" : null}>
          <Num value={a.waitForFRA ? a.fra : a.claimAge} disabled={!!a.waitForFRA} w="xs"
            onChange={(v) => setA({ claimAge: v })} /></R>
        <R label="Estimated benefit" hint={`${pct(proj.ss.factor, 0)} of the full amount · covers ${pct(proj.ssCoverage, 0)} of your retirement spending`}>
          <span className="affix fig br">{money(proj.ss.annualAtClaim)}</span></R>
        <R label="First year you earned"><YearNum value={a.ssFirstYear} onChange={(v) => setA({ ssFirstYear: v })} w="sm" /></R>
        <R label="Full retirement age"><Num value={a.fra} onChange={(v) => setA({ fra: v })} w="xs" /></R>
        <R label="Taxable wage cap"><Num value={a.taxableMax} onChange={(v) => setA({ taxableMax: v })} prefix="$" /></R>
        <R label="Share of benefit taxable" hint={proj.spendIsGross ? "Not in use while spending is stated gross" : null}>
          <Pctf value={a.ssTaxablePortion} onChange={(v) => setA({ ssTaxablePortion: v })} /></R>
      </Group>

      <Group id="vest" title="Vesting and future inflows" open={open.vest} toggle={toggle}
        summary={`${moneyShort(proj.vestScheduled)} scheduled, ${pct(proj.vestShare, 0)} directed`}
        lead="Nothing here reaches the portfolio unless you direct it. At 0% the tranches are recorded but treated as money that goes elsewhere.">
        <R label="Share added to the portfolio" hint={`${money(proj.vestDirected)} of ${money(proj.vestScheduled)} currently reaching it`}>
          <Pctf value={a.vestingToPortfolio} onChange={(v) => setA({ vestingToPortfolio: v })} /></R>
        <R label="Unvested equity"><Num value={p.unvestedEquity} onChange={(v) => setP({ unvestedEquity: v })} prefix="$" /></R>
        <R label="Unvested carry"><Num value={p.unvestedCarry} onChange={(v) => setP({ unvestedCarry: v })} prefix="$" /></R>
        <div className="lead-in" style={{ paddingTop: 10 }}>Tranches — label, amount, year, and your confidence it pays.</div>
        {(p.vesting || []).map((v, i) => (
          <div className="r" key={v.id}>
            <Txt placeholder={`Tranche ${i + 1}`} value={v.label}
              onChange={(t) => setP({ vesting: p.vesting.map((x, j) => j === i ? { ...x, label: t } : x) })} />
            <div className="vl" style={{ display: "flex", gap: 5 }}>
              <Num value={v.amount} prefix="$" w="sm"
                onChange={(val) => setP({ vesting: p.vesting.map((x, j) => j === i ? { ...x, amount: val } : x) })} />
              <YearNum value={v.year} placeholder="yr" w="xs"
                onChange={(val) => setP({ vesting: p.vesting.map((x, j) => j === i ? { ...x, year: val } : x) })} />
              <Pctf value={(v.prob ?? 100) / 100} w="xs"
                onChange={(val) => setP({ vesting: p.vesting.map((x, j) => j === i ? { ...x, prob: val * 100 } : x) })} />
            </div>
          </div>
        ))}
      </Group>

      <Group id="house" title="The house and mortgage" open={open.house} toggle={toggle}
        summary={proj.mortRetirementYears > 0
          ? `${proj.mortRetirementYears} years of payments after you retire`
          : money(bs.homeEquity) + " equity"}
        lead="Home equity sits outside the drawdown and only reaches the portfolio if you sell. Worth setting once, not worth agonising over.">
        <R label="Payments left when you retire"
          hint={proj.mortPayoffAge != null ? `Loan clears at ${proj.mortPayoffAge}, you retire at ${proj.retAge}` : "Never clears within the plan"}>
          <span className={"affix fig " + (proj.mortRetirementYears > 0 ? "neg" : "pos")} style={{ fontSize: 15 }}>
            {proj.mortRetirementYears > 0 ? `${proj.mortRetirementYears} years` : "none"}
          </span>
        </R>
        <R label="Retirement budgets treat the payment as"
          hint={proj.mortgageInSpend
            ? `Budgets exclude it; the model adds ${money(proj.annualMortgagePayment)} a year while the loan runs, then stops`
            : `Your budgets carry it — and keep carrying it after the loan clears at ${proj.mortPayoffAge}, which overstates your spending`}>
          <div className="seg">
            <button className={!proj.mortgageInSpend ? "on" : ""} onClick={() => setA({ mortgageInSpend: "included" })}>Inside</button>
            <button className={proj.mortgageInSpend ? "on" : ""} onClick={() => setA({ mortgageInSpend: "added" })}>Added</button>
          </div>
        </R>
        {!proj.mortgageInSpend && (
          <div className="note" style={{ padding: "4px 0 8px" }}>
            <b>Added</b> is the more accurate setting, but your budgets then need housing stripped out — about{" "}
            {money(Math.max(0, n(a.budgetA.amount) - proj.annualMortgagePayment))} in place of {money(n(a.budgetA.amount))}.
            In exchange, spending drops on its own the year the loan clears instead of staying flat to{" "}
            {n(a.retirementAge) + n(a.budgetA.years) - 1}.
          </div>
        )}
        {proj.mortgageInSpend && proj.mortRetirementDraw > 0 && (
          <R label="Mortgage paid out of the portfolio" hint={`Over ${proj.mortRetirementYears} retirement years`}>
            <span className="affix fig neg">{money(proj.mortRetirementDraw)}</span></R>
        )}
        <R label="Home value"><Num value={p.homeValue} onChange={(v) => setP({ homeValue: v })} prefix="$" /></R>
        <R label="Mortgage outstanding"><Num value={p.mortgageBalance} onChange={(v) => setP({ mortgageBalance: v })} prefix="$" /></R>
        <R label="Mortgage rate"><Pctf value={p.mortgageRate} onChange={(v) => setP({ mortgageRate: v })} /></R>
        <R label="Monthly payment"><Num value={p.mortgagePayment} onChange={(v) => setP({ mortgagePayment: v })} prefix="$" /></R>
        <R label="Appreciation"><Pctf value={a.homeAppreciation} onChange={(v) => setA({ homeAppreciation: v })} /></R>
        <R label="Cap the value at" hint="Blank lets it compound forever">
          <Num value={a.homeValueCap} onChange={(v) => setA({ homeValueCap: v })} prefix="$" /></R>
        <R label="Sell or downsize at age" hint="Blank holds it for life">
          <Num value={a.sellHomeAge} onChange={(v) => setA({ sellHomeAge: v })} w="xs" /></R>
        <R label="Share of equity to the portfolio"><Pctf value={a.homeReleasePct} onChange={(v) => setA({ homeReleasePct: v })} /></R>
      </Group>
    </>
  );
}

/* ============================================================
   Explore — levers, payments, annual worksheet
   ============================================================ */

const blankSheet = () => ({
  income: Array.from({ length: 5 }, () => ({ id: uid(), label: "", amount: "" })),
  buckets: Array.from({ length: 8 }, () => ({ id: uid(), label: "", amount: "", kind: "spend" })),
});

function growTo(amount, fromAge, toAge, retAge, preR, postR) {
  let v = amount;
  for (let age = Math.round(fromAge); age < Math.round(toAge); age++) v *= 1 + (age >= retAge ? postR : preR);
  return v;
}

/* Defined at module scope. A component declared inside a render body gets a new
   identity on every pass, which makes React unmount and remount it — and any
   input inside loses focus mid-keystroke. */
const Delta = ({ v }) => Math.abs(v) < 1
  ? <span className="mut">no change</span>
  : <span className={v > 0 ? "pos" : "neg"}>{(v > 0 ? "+" : "\u2212") + moneyShort(Math.abs(v))}</span>;

function LeverValue({ f, value, set }) {
  if (f.t === "choice") return (
    <select className="inp sel" value={String(value)}
      onChange={(e) => set(f.opts[0][0] === true ? e.target.value === "true" : e.target.value)}>
      {f.opts.map(([val, lab]) => <option key={String(val)} value={String(val)}>{lab}</option>)}
    </select>
  );
  if (f.t === "pct") return <Pctf value={value} onChange={set} />;
  if (f.t === "year") return <YearNum value={value} w="sm" onChange={set} />;
  if (f.t === "num") return <Num value={value} w="xs" onChange={set} />;
  return <Num value={value} prefix="$" w="sm" onChange={set} />;
}

function Lever({ slot, lever, m, mBase, orig, accent, setLever, pick }) {
  const f = FIELD_BY_KEY[lever.k];
  const set = (v) => setLever(slot, { v });
  const fmtV = (v) => {
    if (!f) return "";
    if (f.t === "choice") return (f.opts.find((o) => String(o[0]) === String(v)) || [, "\u2014"])[1];
    if (v === "" || v == null) return "blank";
    if (f.t === "pct") return pct(n(v));
    if (f.t === "money") return money(n(v));
    return String(v);
  };
  return (
    <div className="card" style={{ marginTop: 9, borderLeft: `3px solid ${accent}` }}>
      <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
        <select className="inp txt" style={{ flex: "1 1 160px", minWidth: 0 }}
          value={lever.k} onChange={(e) => pick(slot, e.target.value)}>
          <option value="">Choose a field\u2026</option>
          {Object.entries(FIELD_GROUPS).map(([g, list]) => (
            <optgroup key={g} label={g}>
              {list.map((fd) => <option key={fd.k} value={fd.k}>{fd.l}</option>)}
            </optgroup>
          ))}
        </select>
        {f && <LeverValue f={f} value={lever.v} set={set} />}
        {f && <button className="btn gh sm" onClick={() => set(orig)}>reset</button>}
      </div>
      {f && m && (
        <>
          <div className="note" style={{ marginTop: 7 }}>{fmtV(orig)} \u2192 <span className="br">{fmtV(lever.v)}</span></div>
          <div style={{ display: "flex", gap: 22, marginTop: 8, flexWrap: "wrap" }}>
            <div><div className="k">At {m.retAge}</div>
              <div className="fig" style={{ fontSize: 17 }}>{moneyShort(m.atRet)}</div>
              <div style={{ fontSize: 11 }}><Delta v={m.atRet - mBase.atRet} /></div></div>
            <div><div className="k">At {m.deathAge}</div>
              <div className="fig" style={{ fontSize: 17 }}>{moneyShort(m.atDeath)}</div>
              <div style={{ fontSize: 11 }}><Delta v={m.atDeath - mBase.atDeath} /></div></div>
            <div><div className="k">Runs dry</div>
              <div className={"fig " + (m.dry ? "neg" : "pos")} style={{ fontSize: 17 }}>{m.dry || "never"}</div>
              <div style={{ fontSize: 11 }} className="mut">
                {m.dry === mBase.dry ? "unchanged" : mBase.dry ? `was ${mBase.dry}` : "was never"}</div></div>
          </div>
        </>
      )}
    </div>
  );
}

function ExploreTab({ state, setA, setState, proj, real, open, toggle }) {
  const a = state.assumptions, p = state.profile;
  const base = { profile: p, assumptions: a };
  const wi = state.whatif || { a: { k: "", v: null }, b: { k: "", v: null } };
  const infl = n(a.inflation);
  const df = (age) => Math.pow(1 + infl, age - proj.age0);

  const setLever = (slot, patch) => setState((s) => ({
    ...s, whatif: { ...(s.whatif || { a: { k: "", v: null }, b: { k: "", v: null } }), [slot]: { ...wi[slot], ...patch } },
  }));
  const pick = (slot, key) => setLever(slot, { k: key, v: key ? pathGet(base, key) : null });

  const metrics = (pr) => ({
    atRet: pr.portfolioAtRetirement / df(pr.retAge),
    atDeath: pr.terminalPortfolio / df(pr.deathAge),
    dry: pr.depletionAge, retAge: pr.retAge, deathAge: pr.deathAge,
  });
  const mBase = metrics(proj);
  const runLever = (l) => (l.k ? project(pathSet(base, l.k, l.v).profile, pathSet(base, l.k, l.v).assumptions) : null);
  const projA = runLever(wi.a), projB = runLever(wi.b);
  let bothSt = base;
  if (wi.a.k) bothSt = pathSet(bothSt, wi.a.k, wi.a.v);
  if (wi.b.k) bothSt = pathSet(bothSt, wi.b.k, wi.b.v);
  const projBoth = wi.a.k && wi.b.k ? project(bothSt.profile, bothSt.assumptions) : null;

  /* one-off payments */
  const extras = a.extras || [];
  const setExtra = (i, patch) => setA({ extras: extras.map((x, j) => (j === i ? { ...x, ...patch } : x)) });
  const anyExtras = extras.some((x) => n(x.amount) > 0 && n(x.year) > 0);
  const allTo = (dest) => extras.map((x) => (n(x.amount) ? { ...x, dest } : x));
  const routes = [
    { k: "asis", nm: "As entered", pr: proj },
    { k: "port", nm: "All to investments", pr: project(p, { ...a, extras: allTo("portfolio") }) },
    { k: "mort", nm: "All to mortgage", pr: project(p, { ...a, extras: allTo("mortgage") }) },
  ];

  /* annual worksheet */
  const annual = state.annual || { year: CY, sheets: {} };
  const yr = n(annual.year, CY);
  const sheet = annual.sheets[yr] || blankSheet();
  const setAnnual = (patch) => setState((s) => ({ ...s, annual: { ...(s.annual || { year: CY, sheets: {} }), ...patch } }));
  const setSheet = (patch) => setState((s) => {
    const an = s.annual || { year: CY, sheets: {} }; const y = n(an.year, CY);
    return { ...s, annual: { ...an, sheets: { ...an.sheets, [y]: { ...(an.sheets[y] || blankSheet()), ...patch } } } };
  });
  const ageY = n(p.currentAge) + (yr - CY);
  const dfl = (toAge) => (real ? Math.pow(1 + infl, toAge - proj.age0) : 1);
  const atRetV = (amt) => growTo(amt, ageY, proj.retAge, proj.retAge, n(a.preReturn), n(a.postReturn)) / dfl(proj.retAge);
  const atDeathV = (amt) => growTo(amt, ageY, proj.deathAge, proj.retAge, n(a.preReturn), n(a.postReturn)) / dfl(proj.deathAge);
  const income = sheet.income.reduce((s, r) => s + n(r.amount), 0);
  const invested = sheet.buckets.filter((b) => b.kind === "investment").reduce((s, b) => s + n(b.amount), 0);
  const spentB = sheet.buckets.filter((b) => b.kind === "spend").reduce((s, b) => s + n(b.amount), 0);
  const leftOver = income - invested - spentB;
  const filledYears = Object.keys(annual.sheets).map(Number).sort((x, y) => x - y);

  return (
    <>
      <H>One decision at a time</H>
      <div className="note" style={{ paddingBottom: 4 }}>
        Change any field without touching your actual inputs. Baseline is {moneyShort(mBase.atRet)} at {mBase.retAge} and{" "}
        {moneyShort(mBase.atDeath)} at {mBase.deathAge}.
      </div>
      <Lever slot="a" lever={wi.a} m={projA ? metrics(projA) : null} mBase={mBase}
        orig={wi.a.k ? pathGet(base, wi.a.k) : null} accent="#9A7526" setLever={setLever} pick={pick} />
      <Lever slot="b" lever={wi.b} m={projB ? metrics(projB) : null} mBase={mBase}
        orig={wi.b.k ? pathGet(base, wi.b.k) : null} accent="#3D6AA6" setLever={setLever} pick={pick} />
      {projBoth && (
        <div className="card" style={{ marginTop: 9, borderLeft: "3px solid #1E7A5A" }}>
          <div className="k">Both together</div>
          <div style={{ display: "flex", gap: 22, marginTop: 5, flexWrap: "wrap" }}>
            <div><div className="k">At {proj.retAge}</div>
              <div className="fig" style={{ fontSize: 17 }}>{moneyShort(metrics(projBoth).atRet)}</div>
              <div style={{ fontSize: 11 }}><Delta v={metrics(projBoth).atRet - mBase.atRet} /></div></div>
            <div><div className="k">At {proj.deathAge}</div>
              <div className="fig" style={{ fontSize: 17 }}>{moneyShort(metrics(projBoth).atDeath)}</div>
              <div style={{ fontSize: 11 }}><Delta v={metrics(projBoth).atDeath - mBase.atDeath} /></div></div>
          </div>
          <div className="note" style={{ marginTop: 6 }}>
            {(() => {
              const both = metrics(projBoth).atDeath - mBase.atDeath;
              const sum = (projA ? metrics(projA).atDeath - mBase.atDeath : 0) + (projB ? metrics(projB).atDeath - mBase.atDeath : 0);
              const diff = both - sum;
              return Math.abs(diff) < Math.abs(both) * 0.02
                ? "The two are close to additive."
                : `Together they're worth ${moneyShort(Math.abs(diff))} ${diff > 0 ? "more" : "less"} than separately — they compound on each other.`;
            })()}
          </div>
        </div>
      )}

      <div style={{ height: 16 }} />

      <Group id="pay" title="One-off payments" open={open.pay} toggle={toggle}
        summary={extras.filter((x) => n(x.amount) > 0).length + " entered"}
        lead="Lump sums from outside — a bonus, a distribution, a sale. Send each to investments or at the mortgage.">
        {extras.map((e, i) => (
          <div className="r" key={e.id}>
            <Txt placeholder={`Payment ${i + 1}`} value={e.label}
              onChange={(t) => setExtra(i, { label: t })} />
            <div className="vl" style={{ display: "flex", gap: 5 }}>
              <Num value={e.amount} prefix="$" w="sm" onChange={(v) => setExtra(i, { amount: v })} />
              <YearNum value={e.year} placeholder="yr" w="xs" onChange={(v) => setExtra(i, { year: v })} />
              <select className="inp sel" value={e.dest} onChange={(ev) => setExtra(i, { dest: ev.target.value })}>
                <option value="portfolio">investments</option>
                <option value="mortgage">mortgage</option>
              </select>
            </div>
          </div>
        ))}
        {anyExtras && (
          <>
            <div className="scr" style={{ maxHeight: "none", marginTop: 10 }}>
              <table className="t">
                <thead><tr><th>Route it</th><th>At {proj.retAge}</th><th>At {proj.deathAge}</th><th>Interest saved</th></tr></thead>
                <tbody>
                  {routes.map((v) => (
                    <tr key={v.k}>
                      <td>{v.nm}</td>
                      <td>{moneyShort(v.pr.portfolioAtRetirement / df(v.pr.retAge))}</td>
                      <td className="fig">{moneyShort(v.pr.terminalPortfolio / df(proj.deathAge))}</td>
                      <td className={v.pr.interestSaved > 0 ? "pos" : "mut"}>
                        {v.pr.interestSaved > 0 ? moneyShort(v.pr.interestSaved) : "—"}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div className="note" style={{ marginTop: 8 }}>
              Read the last two columns together — your mortgage payment isn't a portfolio outflow, so interest you
              avoid can't show up in the portfolio figure. Investments compound at {pct(n(a.postReturn))} and might not;
              the mortgage returns a certain {pct(n(p.mortgageRate))}.
            </div>
          </>
        )}
      </Group>

      <Group id="annual" title="Year worksheet" open={open.annual} toggle={toggle}
        summary={filledYears.length ? filledYears.length + " years mapped" : "none yet"}
        lead="Map one year's income into buckets you name. A scratch pad — nothing here feeds the projection.">
        <R label="Planning for" hint={`You'd be ${ageY}${ageY >= proj.retAge ? ", retired" : ""}`}>
          <YearNum value={annual.year} w="sm" onChange={(v) => setAnnual({ year: v })} /></R>
        {filledYears.length > 0 && (
          <div style={{ display: "flex", gap: 5, flexWrap: "wrap", padding: "6px 0" }}>
            {filledYears.map((y) => (
              <button key={y} className={"btn sm " + (y === yr ? "pri" : "gh")} onClick={() => setAnnual({ year: y })}>{y}</button>
            ))}
          </div>
        )}
        <div className="lead-in" style={{ paddingTop: 8 }}>Coming in</div>
        {sheet.income.map((r, i) => (
          <div className="r" key={r.id}>
            <Txt placeholder={i === 0 ? "Salary" : i === 1 ? "Bonus" : `Source ${i + 1}`}
              value={r.label}
              onChange={(t) => setSheet({ income: sheet.income.map((x, j) => j === i ? { ...x, label: t } : x) })} />

function flatten(obj, prefix = "", out = {}) {
  Object.entries(obj || {}).forEach(([k, v]) => {
    const key = prefix ? prefix + "." + k : k;
    if (Array.isArray(v)) out[key] = JSON.stringify(v.map((x) => (x && x.id ? { ...x, id: undefined } : x)));
    else if (v && typeof v === "object") flatten(v, key, out);
    else out[key] = v;
  });
  return out;
}
const prettyKey = (k) => k.split(".").pop().replace(/([A-Z])/g, " $1").replace(/^./, (c) => c.toUpperCase());
function diffInputs(A, B) {
  const fa = flatten(A), fb = flatten(B);
  const out = [];
  new Set([...Object.keys(fa), ...Object.keys(fb)]).forEach((k) => {
    if (String(fa[k] ?? "") !== String(fb[k] ?? "")) out.push({ key: k, from: fa[k], to: fb[k] });
  });
  return out;
}
function fmtVal(v) {
  if (v === "" || v == null) return "blank";
  if (typeof v === "string" && v.startsWith("[")) return "list changed";
  const num = Number(v);
  if (!isFinite(num)) return String(v);
  if (Math.abs(num) > 0 && Math.abs(num) < 1) return pct(num);
  if (Math.abs(num) >= 1000) return money(num);
  return String(num);
}

function TrackingTab({ state, setState, proj, baselineProj, compareIds, setCompareIds, open, toggle }) {
  const [name, setName] = useState("");
  const scenarios = state.scenarios || [];
  const baseline = scenarios.find((s) => s.isBaseline);
  const base = baselineProj || proj;

  const rows = [];
  for (let y = CY - 6; y <= CY + 3; y++) {
    rows.push({ year: y, planRow: base.rows.find((r) => r.year === y), act: (state.actuals || {})[y] || {} });
  }
  const setAct = (year, patch) =>
    setState((s) => ({ ...s, actuals: { ...s.actuals, [year]: { ...(s.actuals || {})[year], ...patch } } }));

  const recorded = rows.filter((r) => r.act.portfolio !== "" && r.act.portfolio != null && r.planRow);
  const latest = recorded[recorded.length - 1];
  const gap = latest ? n(latest.act.portfolio) - latest.planRow.eoy : null;

  const snapshot = () => ({
    profile: JSON.parse(JSON.stringify(state.profile)),
    assumptions: JSON.parse(JSON.stringify(state.assumptions)),
  });
  const metricsOf = (snap) => {
    const pr = project(snap.profile, snap.assumptions);
    return { atRetirement: pr.portfolioAtRetirement, terminal: pr.terminalEstate, gap: pr.legacyGap,
      depleted: pr.depletionAge, retAge: pr.retAge };
  };
  const save = () => {
    const snap = snapshot();
    setState((st) => ({ ...st, scenarios: [...(st.scenarios || []), {
      id: uid(), name: name.trim() || `Scenario ${scenarios.length + 1}`, createdAt: new Date().toISOString(),
      isBaseline: scenarios.length === 0, ...snap, metrics: metricsOf(snap) }] }));
    setName("");
  };
  const load = (s) => setState((st) => ({ ...st,
    profile: JSON.parse(JSON.stringify(s.profile)), assumptions: JSON.parse(JSON.stringify(s.assumptions)) }));
  const promote = (s) => {
    const prior = scenarios.find((x) => x.isBaseline);
    const changes = prior ? diffInputs({ profile: prior.profile, assumptions: prior.assumptions },
      { profile: s.profile, assumptions: s.assumptions }) : [];
    setState((st) => ({ ...st,
      scenarios: st.scenarios.map((x) => ({ ...x, isBaseline: x.id === s.id })),
      ledger: [...(st.ledger || []), { id: uid(), at: new Date().toISOString(), name: s.name,
        from: prior ? prior.name : null, metrics: s.metrics || metricsOf(s), changes: changes.slice(0, 10) }] }));
  };
  const toggleCmp = (id) => setCompareIds((ids) =>
    ids.includes(id) ? ids.filter((x) => x !== id) : ids.length >= 3 ? ids : [...ids, id]);
  const drift = baseline ? diffInputs({ profile: baseline.profile, assumptions: baseline.assumptions },
    { profile: state.profile, assumptions: state.assumptions }) : [];

  return (
    <>
      <H>Where you actually are</H>
      <div className="card" style={{ marginTop: 4 }}>
        <div className="k">Latest check-in vs {baselineProj ? "your plan of record" : "the plan you're editing"}</div>
        <div className="v fig">{latest ? money(n(latest.act.portfolio)) : "—"}</div>
        <div className={"note " + (gap == null ? "" : gap >= 0 ? "pos" : "neg")} style={{ marginTop: 2 }}>
          {gap == null ? "Enter a balance below to start tracking."
            : `${gap >= 0 ? "Ahead by" : "Behind by"} ${money(Math.abs(gap))} at end of ${latest.year}`}
          {!baselineProj && " · save a scenario as your plan of record to freeze the target"}
        </div>
      </div>

      <div className="scr" style={{ maxHeight: "34vh", marginTop: 12 }}>
        <table className="t">
          <thead><tr><th>Year</th><th>Plan</th><th>Actual</th><th>Variance</th><th>Note</th></tr></thead>
          <tbody>
            {rows.map(({ year, planRow, act }) => {
              const plan = planRow ? planRow.eoy : null;
              const actual = act.portfolio === "" || act.portfolio == null ? null : n(act.portfolio);
              const v = plan != null && actual != null ? actual - plan : null;
              return (
                <tr key={year} className={year === CY ? "mk" : ""}>
                  <td>{year}{year === CY && <span className="mut"> now</span>}</td>
                  <td className="fig">{plan != null ? moneyShort(plan) : "—"}</td>
                  <td><Num value={act.portfolio ?? ""} prefix="$" w="sm" onChange={(val) => setAct(year, { portfolio: val })} /></td>
                  <td className={v == null ? "" : v >= 0 ? "pos" : "neg"}>
                    {v == null ? "—" : (v >= 0 ? "+" : "\u2212") + moneyShort(Math.abs(v))}</td>
                  <td style={{ textAlign: "left" }}>
                    <Txt style={{ minWidth: 130 }} placeholder="What happened"
                      value={act.note ?? ""} onChange={(t) => setAct(year, { note: t })} /></td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      <div style={{ height: 14 }} />

      <Group id="scen" title="Scenarios" open={open.scen} toggle={toggle}
        summary={scenarios.length ? `${scenarios.length} saved` : "none yet"}
        lead="What you're editing is a sandbox. Saving freezes a copy; one becomes your plan of record, and your actuals are measured against it.">
        <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
          <input className="inp txt" placeholder="Name this version" value={name} onChange={(e) => setName(e.target.value)} />
          <button className="btn pri" onClick={save}>Save</button>
        </div>
        {baseline && drift.length > 0 && (
          <div className="note" style={{ marginBottom: 8 }}>
            {drift.length} change{drift.length > 1 ? "s" : ""} from “{baseline.name}”:{" "}
            {drift.slice(0, 4).map((d) => `${prettyKey(d.key)} ${fmtVal(d.from)}→${fmtVal(d.to)}`).join(" · ")}
            {drift.length > 4 && ` and ${drift.length - 4} more`}
          </div>
        )}
        {scenarios.length === 0 ? (
          <div className="empty">Set your assumptions the way you expect things to go, then save it as your plan of record.</div>
        ) : (
          <div className="scr" style={{ maxHeight: "30vh" }}>
            <table className="t">
              <thead><tr><th>Scenario</th><th>Retire</th><th>Estate</th><th>vs goal</th><th>Dry</th><th></th></tr></thead>
              <tbody>
                {scenarios.map((s) => {
                  const m = s.metrics || metricsOf(s);
                  return (
                    <tr key={s.id}>
                      <td>
                        <label className="chk">
                          <input type="checkbox" checked={compareIds.includes(s.id)} onChange={() => toggleCmp(s.id)} />
                          <span>{s.name} {s.isBaseline && <span className="pill on">plan of record</span>}</span>
                        </label>
                      </td>
                      <td>{m.retAge}</td>
                      <td className="fig">{moneyShort(m.terminal)}</td>
                      <td className={m.gap >= 0 ? "pos" : "neg"}>
                        {(m.gap >= 0 ? "+" : "\u2212") + moneyShort(Math.abs(m.gap))}</td>
                      <td className={m.depleted ? "neg" : "pos"}>{m.depleted || "never"}</td>
                      <td style={{ whiteSpace: "nowrap" }}>
                        <button className="btn gh sm" onClick={() => load(s)}>Open</button>{" "}
                        {!s.isBaseline && <button className="btn gh sm" onClick={() => promote(s)}>Make plan</button>}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
        {compareIds.length > 0 && (
          <div className="note" style={{ marginTop: 8 }}>
            {compareIds.map((id, i) => {
              const s = scenarios.find((x) => x.id === id);
              return s ? <span key={id} style={{ marginRight: 12 }}>
                <span className="dot" style={{ background: SCOL[i % 3] }} /> {s.name}</span> : null;
            })} drawn on the Outlook chart.
          </div>
        )}
      </Group>

      <Group id="ledger" title="How the plan has changed" open={open.ledger} toggle={toggle}
        summary={(state.ledger || []).length ? `${state.ledger.length} entries` : "no history"}>
        {(state.ledger || []).length === 0 ? (
          <div className="empty">Each time you adopt a new plan of record, what changed and what it did lands here.</div>
        ) : [...state.ledger].reverse().map((e) => (
          <div className="card" key={e.id} style={{ marginTop: 8 }}>
            <div style={{ display: "flex", gap: 8, alignItems: "baseline" }}>
              <strong>{e.name}</strong>
              {e.from && <span className="note">replaced “{e.from}”</span>}
              <span className="note" style={{ marginLeft: "auto" }}>{new Date(e.at).toLocaleDateString()}</span>
            </div>
            <div className="note" style={{ marginTop: 4 }}>
              Retire {e.metrics.retAge} · estate {moneyShort(e.metrics.terminal)} ·{" "}
              <span className={e.metrics.gap >= 0 ? "pos" : "neg"}>
                {e.metrics.gap >= 0 ? "clears" : "misses"} the goal by {moneyShort(Math.abs(e.metrics.gap))}</span>
            </div>
            {e.changes && e.changes.length > 0 && (
              <div className="note" style={{ marginTop: 4 }}>
                {e.changes.map((c) => `${prettyKey(c.key)} ${fmtVal(c.from)}→${fmtVal(c.to)}`).join(" · ")}
              </div>
            )}
          </div>
        ))}
      </Group>

      <Group id="method" title="What the model assumes" open={open.method} toggle={toggle}
        summary="tax, Social Security, what's excluded">
        <MethodBody state={state} proj={proj} />
      </Group>
    </>
  );
}

/* ============================================================
   Method disclosure
   ============================================================ */

const Sect = ({ t, items }) => (
  <>
    <div className="lead-in" style={{ paddingTop: 12, color: "#9A7526", fontWeight: 600 }}>{t}</div>
    {items.map(([k, v], i) => (
      <div className="r" key={i}>
        <span className="lb" style={{ flex: "0 0 33%" }}>{k}</span>
        <span style={{ flex: 1, color: "#5C6472", fontSize: 12 }}>{v}</span>
      </div>
    ))}
  </>
);

function MethodBody({ state, proj }) {
  const a = state.assumptions, p = state.profile, g = proj.spendIsGross;
  return (
    <>
      <Sect t="Tax" items={[
        ["Basis", g ? "Your spending figures are gross of tax — the year's tax bill sits inside the number you entered, and nothing is added to withdrawals."
                    : `Spending is net of tax, so withdrawals are divided by (1 − ${pct(n(a.effectiveTaxRate), 0)}).`],
        ["Social Security", g ? "Counted gross, because tax on it is already inside your spending. Counting it net would deduct that tax twice."
                              : `Reduced by ${pct(n(a.ssTaxablePortion), 0)} × ${pct(n(a.effectiveTaxRate), 0)} before offsetting spending.`],
        ["Account type", "One blended rate. No distinction between Roth, traditional and taxable, no withdrawal ordering, no separate capital gains treatment."],
        ["Required distributions", "Not modelled. RMDs after 73 may force withdrawals beyond your needs, and the tax on those isn't captured."],
        ["State tax", "Not separated. If your rate excludes it, the plan is optimistic by that much."],
        ["Over time", "One rate for every year. Bracket changes and your own income mix shifting are outside the model."],
      ]} />
      <Sect t="Social Security" items={[
        ["Formula", `Standard PIA against current bend points ($${SS_DEFAULTS.bend1.toLocaleString()} and $${SS_DEFAULTS.bend2.toLocaleString()}), not projected forward.`],
        ["Earnings", `Every year from ${n(a.ssFirstYear)} to retirement assumed at the ${money(n(a.taxableMax))} cap. Best 35 count; you have ${proj.ss.yearsCredited}.`],
        ["Wage indexing", "Not applied, which understates the benefit for older earnings years."],
        ["Programme risk", "Assumed to pay in full. Trust fund projections show a shortfall in the mid-2030s absent legislation."],
        ["Spouse", "No spousal, survivor or dependent benefits."],
      ]} />
      <Sect t="Returns and timing" items={[
        ["Path", `Flat ${pct(n(a.preReturn))} then ${pct(n(a.postReturn))}. No volatility — that's the stress test's job.`],
        ["Real return", `${pct(proj.realPostReturn)} after inflation in retirement. This decides whether the balance compounds or declines.`],
        ["Cash flows", "Spread through the year, earning roughly half a year of return. Annual steps only."],
        ["Fees", "Not deducted. Subtract advisor and fund costs from your return assumption yourself."],
      ]} />
      <Sect t="The mortgage, settled" items={[
        ["Before retirement", `Don't pay it down. You assume ${pct(n(a.preReturn))} in the market against a ${pct(n(p.mortgageRate))} loan, and money diverted now compounds for decades. Tested at $25k, $50k and $75k a year of extra principal funded from saving: every one left the plan worse off, the $50k case giving up about $2.1M at 95 to save $813k of interest.`],
        ["At retirement", `Closer than it looks. Your post-retirement assumption of ${pct(n(a.postReturn))} is below the ${pct(n(p.mortgageRate))} rate, so clearing the balance in a lump beats investing the same sum — by roughly $31k on an $8.5M portfolio, which is a rounding error. Some of that margin is a timing convention in this model, not real economics.`],
        ["The real argument", "The rate you avoid is guaranteed; the return you expect is not. Where the two are within a point of each other, the certain one is worth more than the arithmetic shows."],
        ["What not to do", "Don't let the debt distract you. The balance is large and visible, and the pull to clear it is emotional rather than financial. Over your remaining working years the market is the better home for surplus cash by a wide margin."],
      ]} />
      <Sect t="Outside the portfolio" items={[
        ["Vesting", proj.vestShare > 0 ? `${pct(proj.vestShare, 0)} directed — ${money(proj.vestDirected)} of ${money(proj.vestScheduled)}.`
          : `None. ${money(proj.vestScheduled)} scheduled but nothing reaches the portfolio.`],
        ["Cash reserve", `${money(n(p.cashReserve))} never drawn on.`],
        ["529s", `${money(n(p.fiveTwoNine))} excluded from the drawdown and the estate.`],
        ["The house", "Never funds spending unless you sell."],
        ["Mortgage payment", proj.mortgageInSpend
          ? `Added to retirement spending from the real amortisation schedule while the loan runs, then it stops. Fixed in nominal dollars, so it never inflates — unlike everything else you spend.`
          : `Assumed to be inside the budgets you entered. Note those budgets stay flat after the loan clears at ${proj.mortPayoffAge}, so the plan keeps charging you for a mortgage you no longer have.`],
        ["Salary", "No longer used at all — Social Security assumes the wage cap every year, so income doesn't reach the model."],
      ]} />
      <Sect t="Not modelled" items={[
        ["Health and care", "No long-term care, medical shock, or Medicare premium detail. A single late-life care event can exceed everything else here."],
        ["Longevity", `The plan stops at ${proj.deathAge}. No probability of living longer, no annuity.`],
        ["Household", "One person. No spouse's income, accounts, benefits or lifespan."],
        ["Employment", "Continuous earnings to retirement. No job loss, sabbatical or disability."],
        ["Behaviour", "Fixed budgets. Real retirees cut back in bad markets, which makes this conservative."],
      ]} />
      <div className="note" style={{ marginTop: 14 }}>
        A planning model, not advice. Its value is showing which assumptions your conclusion rests on.
      </div>
    </>
  );
}

/* ============================================================
   App
   ============================================================ */

function App() {
  const [state, setState] = useState(DEFAULT_STATE);
  const [loaded, setLoaded] = useState(false);
  const [status, setStatus] = useState("Loading…");
  const [leftTab, setLeftTab] = useState("inputs");
  const [rightTab, setRightTab] = useState("outlook");
  const [chartView, setChartView] = useState("balance");
  const [compareIds, setCompareIds] = useState([]);
  const [open, setOpen] = useState({});
  const toggle = (id) => setOpen((o) => ({ ...o, [id]: !o[id] }));
  const first = useRef(true);
  const latest = useRef(state);
  const dirty = useRef(false);
  useEffect(() => { latest.current = state; }, [state]);

  const writeNow = async () => {
    const res = persist(latest.current);
    if (res.ok) { dirty.current = false; setStatus("Saved " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })); }
    else setStatus("Not saved: " + res.error);
  };

  useEffect(() => {
    let alive = true;
    (async () => {
      const res = loadState();
      if (!alive) return;
      if (res.data) {
        setState({ ...DEFAULT_STATE, ...res.data,
          profile: { ...DEFAULT_PROFILE, ...(res.data.profile || {}) },
          assumptions: { ...DEFAULT_ASSUMPTIONS, ...(res.data.assumptions || {}) },
          ui: { ...DEFAULT_STATE.ui, ...(res.data.ui || {}) } });
        setStatus("Loaded");
      } else setStatus(res.ok ? "New plan" : "Storage unavailable — copy a backup before leaving");
      setLoaded(true);
    })();
    return () => { alive = false; };
  }, []);

  useEffect(() => {
    if (!loaded) return;
    if (first.current) { first.current = false; return; }
    dirty.current = true;
    setStatus("Saving…");
    const t = setTimeout(() => { writeNow(); }, 500);
    return () => clearTimeout(t);
  }, [state, loaded]);

  useEffect(() => {
    if (!loaded) return;
    const flush = () => { if (dirty.current) persist(latest.current); };
    const onVis = () => { if (document.visibilityState === "hidden") flush(); };
    window.addEventListener("pagehide", flush);
    document.addEventListener("visibilitychange", onVis);
    return () => {
      window.removeEventListener("pagehide", flush);
      document.removeEventListener("visibilitychange", onVis);
      flush();
    };
  }, [loaded]);

  const setA = (patch) => setState((s) => ({ ...s, assumptions: { ...s.assumptions, ...patch } }));
  const setP = (patch) => setState((s) => ({ ...s, profile: { ...s.profile, ...patch } }));

  const proj = useMemo(() => project(state.profile, state.assumptions), [state.profile, state.assumptions]);
  const levers = useMemo(() => ({
    contribution: solveContribution(state.profile, state.assumptions),
    retAge: solveRetirementAge(state.profile, state.assumptions),
    ret: solveReturn(state.profile, state.assumptions),
  }), [state.profile, state.assumptions]);

  const baseline = (state.scenarios || []).find((s) => s.isBaseline);
  const baselineProj = useMemo(() => (baseline ? project(baseline.profile, baseline.assumptions) : null), [baseline]);
  const compare = useMemo(() => compareIds.map((id) => {
    const s = (state.scenarios || []).find((x) => x.id === id);
    return s ? { id, name: s.name, proj: project(s.profile, s.assumptions) } : null;
  }).filter(Boolean), [compareIds, state.scenarios]);

  const stressCfg = state.stress || DEFAULT_STATE.stress;
  const setCfg = (patch) => setState((s) => ({ ...s, stress: { ...(s.stress || DEFAULT_STATE.stress), ...patch } }));
  const stress = useMemo(() => rightTab !== "stress" ? null
    : stressTest(state.profile, state.assumptions, { ...stressCfg, anchors: [-3, 0, 3] }),
    [rightTab, state.profile, state.assumptions, stressCfg.equityShare, stressCfg.otherReal, stressCfg.mode, stressCfg.window]);

  const real = state.ui.display === "real";
  const dfEnd = Math.pow(1 + n(state.assumptions.inflation), proj.deathAge - proj.age0);
  const dfRet = Math.pow(1 + n(state.assumptions.inflation), proj.retAge - proj.age0);
  const show = (v, d) => (real ? v / d : v);

  const backup = async () => {
    try { await navigator.clipboard.writeText(JSON.stringify(state)); setStatus("Backup copied"); }
    catch (e) { setStatus("Couldn't reach the clipboard"); }
  };
  const restore = () => {
    const txt = window.prompt("Paste a backup to replace everything:");
    if (!txt) return;
    try {
      const d = JSON.parse(txt);
      setState({ ...DEFAULT_STATE, ...d,
        profile: { ...DEFAULT_PROFILE, ...(d.profile || {}) },
        assumptions: { ...DEFAULT_ASSUMPTIONS, ...(d.assumptions || {}) },
        ui: { ...DEFAULT_STATE.ui, ...(d.ui || {}) } });
      setStatus("Backup restored");
    } catch (e) { setStatus("That wasn't a valid backup"); }
  };

  const lasts = !proj.depletionAge;
  const leftOver = show(proj.terminalPortfolio, dfEnd);

  return (
    <div className="rp">
      <style>{CSS}</style>

      <div className="hd">
        <h1>{state.profile.name ? `${state.profile.name}'s plan` : "Retirement plan"}</h1>
        <span className="sub">{n(state.profile.currentAge)} today · retiring {proj.retAge} · through {proj.deathAge}</span>
        <div className="right">
          <div className="seg">
            <button className={real ? "on" : ""} onClick={() => setState((s) => ({ ...s, ui: { ...s.ui, display: "real" } }))}>Today's $</button>
            <button className={!real ? "on" : ""} onClick={() => setState((s) => ({ ...s, ui: { ...s.ui, display: "nominal" } }))}>Future $</button>
          </div>
          <button className="btn sm" onClick={writeNow}>Save</button>
          <button className="btn gh sm" onClick={backup}>Backup</button>
          <button className="btn gh sm" onClick={restore}>Restore</button>
          <span className="note">{status}</span>
        </div>
      </div>

      <div className="verdict">
        <div className="lead">
          {lasts ? <>Funded through {proj.deathAge}, with <span className="big fig pos">{moneyShort(leftOver)}</span> left over</>
                 : <>Runs out at <span className="big fig neg">{proj.depletionAge}</span>, {proj.deathAge - proj.depletionAge} years short</>}
        </div>
        <div className="stats">
          <div className="stat"><div className="k">At retirement</div>
            <div className="v fig">{moneyShort(show(proj.portfolioAtRetirement, dfRet))}</div></div>
          <div className="stat"><div className="k">You withdraw</div>
            <div className="v fig">{pct(proj.withdrawalRate)}</div></div>
          <div className="stat"><div className="k">Portfolio earns</div>
            <div className="v fig">{pct(proj.realPostReturn)}</div></div>
          <div className="stat"><div className="k">Legacy goal</div>
            <div className={"v fig " + (proj.legacyGap >= 0 ? "pos" : "neg")}>
              {(proj.legacyGap >= 0 ? "+" : "\u2212") + moneyShort(Math.abs(show(proj.legacyGap, dfEnd)))}</div></div>
        </div>
      </div>

      <div className="split">
        <div className="pane">
          <div className="tabs">
            <button className={"tab " + (leftTab === "inputs" ? "on" : "")} onClick={() => setLeftTab("inputs")}>Your plan</button>
            <button className={"tab " + (leftTab === "explore" ? "on" : "")} onClick={() => setLeftTab("explore")}>Explore</button>
          </div>
          <div className="body">
            {leftTab === "inputs" && <InputsTab state={state} setA={setA} setP={setP} proj={proj} open={open} toggle={toggle} />}
            {leftTab === "explore" && <ExploreTab state={state} setA={setA} setState={setState} proj={proj} real={real} open={open} toggle={toggle} />}
          </div>
        </div>

        <div className="pane">
          <div className="tabs">
            <button className={"tab " + (rightTab === "outlook" ? "on" : "")} onClick={() => setRightTab("outlook")}>Outlook</button>
            <button className={"tab " + (rightTab === "years" ? "on" : "")} onClick={() => setRightTab("years")}>Year by year</button>
            <button className={"tab " + (rightTab === "stress" ? "on" : "")} onClick={() => setRightTab("stress")}>Stress test</button>
            <button className={"tab " + (rightTab === "track" ? "on" : "")} onClick={() => setRightTab("track")}>Tracking</button>
          </div>
          <div className="body">
            {rightTab === "outlook" && <OutlookTab proj={proj} state={state} real={real} compare={compare}
              levers={levers} view={chartView} setView={setChartView} />}
            {rightTab === "years" && <YearsTab proj={proj} real={real} a={state.assumptions} setA={setA} />}
            {rightTab === "stress" && <StressTab result={stress} cfg={stressCfg} setCfg={setCfg} proj={proj} />}
            {rightTab === "track" && <TrackingTab state={state} setState={setState} proj={proj}
              baselineProj={baselineProj} compareIds={compareIds} setCompareIds={setCompareIds}
              open={open} toggle={toggle} />}
          </div>
        </div>
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));


</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () { /* fine, just no offline */ });
    });
  }
</script>
</body>
</html>
